# Cổng duy nhất của Mộc (F1.2). Danh sách trắng: đường dẫn nào không có ở đây thì về giao diện,
# và các đường dẫn quản trị của thành phần lõi bị chặn tường minh (route "chan").
#
#   /realms/<realm>/*, /resources/*  → Keycloak (đăng nhập)          — không cần token
#   /v1/graphql                      → Hasura                       — cần token
#   /api/files, /api/files/*, /api/search → svc-files                — cần token
#   /*                               → app-office (giao diện tĩnh)   — không cần token
#
# Kiểm token ở biên bằng JWKS của Keycloak (zero-trust: Hasura và svc-files vẫn kiểm lại).

upstreams:
  - id: keycloak
    type: roundrobin
    pass_host: pass
    nodes:
      "keycloak:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1
  - id: svc-files
    type: roundrobin
    nodes:
      "svc-files:8000": 1
  - id: app-office
    type: roundrobin
    nodes:
      "app-office:8080": 1

plugin_configs:
  - id: can-token
    plugins:
      openid-connect:
        # Chỉ kiểm chữ ký, hạn và iss của token Bearer; client_secret không dùng ở chế độ này
        client_id: app-office
        client_secret: khong-dung
        discovery: http://keycloak:8080/realms/${{MOC_REALM}}/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        realm: ${{MOC_REALM}}
        set_access_token_header: false
        set_id_token_header: false
        set_userinfo_header: false

global_rules:
  - id: 1
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid

routes:
  - id: keycloak
    uris: ["/realms/${{MOC_REALM}}", "/realms/${{MOC_REALM}}/*", "/resources/*"]
    upstream_id: keycloak

  - id: graphql
    uri: /v1/graphql
    methods: [POST]
    upstream_id: hasura
    plugin_config_id: can-token
    plugins:
      proxy-rewrite:
        headers:
          # khóa quản trị Hasura không bao giờ được đi từ ngoài vào
          remove: [X-Hasura-Admin-Secret]

  - id: svc-files
    uris: ["/api/files", "/api/files/*", "/api/search"]
    methods: [GET, POST]
    upstream_id: svc-files
    plugin_config_id: can-token

  # Giao diện quản trị và API nội bộ của các thành phần lõi: không bao giờ qua cổng
  - id: chan
    uris:
      - /admin
      - /admin/*
      - /realms/*
      - /console
      - /console/*
      - /v1/*
      - /v2/*
      - /v1alpha1/*
      - /healthz
      - /metrics
      - /api/*
      - /flowable-rest/*
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "{\"error\":\"not_found\"}"

  - id: app-office
    uri: /*
    priority: -10
    methods: [GET, HEAD]
    upstream_id: app-office
#END
