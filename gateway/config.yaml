# APISIX chạy standalone: route đọc từ apisix.yaml, không cần etcd, không có Admin API.
# Giá trị ${{TÊN}} lấy từ biến môi trường của container (docker-compose.yml).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_control: false
  enable_server_tokens: false
  # F3.3: container bị xóa rồi dựng lại (tự phục hồi) có IP mới — chỉ tin bản ghi DNS của Docker 5 giây thay vì
  # TTL 600 giây, để cổng tìm thấy dịch vụ mới ngay
  dns_resolver_valid: 5
  ssl:
    enable: false
  # F1.9: trên máy chủ, proxy TLS (Caddy, docs/trien-khai.md) đứng trước APISIX. APISIX 3.18 ghi đè X-Forwarded-Proto,
  # -Host, -Port bằng giá trị nó thấy (http, cổng 9080) trừ khi yêu cầu tới từ địa chỉ tin cậy — không thì Keycloak
  # tưởng người dùng ở http, trả token_endpoint http://… và trình duyệt chặn lần đăng nhập. Mặc định 127.0.0.1/32: không
  # ai tới APISIX từ loopback của chính container, nghĩa là không tin ai (máy dev, CI)
  trusted_addresses:
    - "${{MOC_TRUSTED_PROXY:=127.0.0.1/32}}"

nginx_config:
  error_log_level: warn
  # apisix.yaml đọc các biến này lúc chạy, nên phải khai cho tiến trình worker của nginx
  envs:
    - MOC_REALM
    - MOC_FILES_MAX_MB
    - MOC_RATE_LOGIN_PER_MIN
    - MOC_RATE_API_PER_MIN
    - MOC_RATE_VERIFY_PER_MIN
    - MOC_RATE_REALTIME_PER_MIN
  # F4.4: đường dẫn bỏ chuỗi truy vấn cho access_log_format bên dưới. $request_uri (đường dẫn client gửi) và
  # $upstream_uri (APISIX ghép sẵn ?… vào) đều mang chuỗi truy vấn; log_format không cắt chuỗi được nên dùng map:
  # giữ phần trước dấu ? đầu tiên (nhóm khớp đặt tên moc_dd…)
  http_configuration_snippet: |
    map $request_uri $moc_duong_dan {
        "~^(?<moc_dd>[^?]*)" $moc_dd;
    }
    map $upstream_uri $moc_duong_dan_upstream {
        "~^(?<moc_dd_upstream>[^?]*)" $moc_dd_upstream;
    }
  http:
    # svc-files tự giới hạn theo MOC_FILES_MAX_MB; ở biên chỉ chặn yêu cầu quá lớn rõ ràng
    client_max_body_size: 64m
    # Giới hạn đăng nhập, cổng xác thực đếm theo IP nguồn. Sau proxy TLS mọi yêu cầu mang IP của proxy: lấy IP người
    # dùng từ X-Forwarded-For, chỉ khi yêu cầu tới từ MOC_TRUSTED_PROXY (như trusted_addresses ở trên)
    real_ip_header: X-Forwarded-For
    real_ip_recursive: "on"
    real_ip_from:
      - "${{MOC_TRUSTED_PROXY:=127.0.0.1/32}}"
    # F4.4: không ghi chuỗi truy vấn (ô tìm kiếm ?q=…, mã đăng nhập ?code=…&state=…) và Referer (URL đầy đủ của trang
    # trước). Các trường khác giữ như định dạng mặc định của APISIX 3.18: "$request" thành phương thức, đường dẫn, giao
    # thức; "$upstream_scheme://$upstream_host$upstream_uri" giữ nguyên trừ ?…. APISIX bọc chuỗi này trong '…' khi
    # dựng nginx.conf: không dùng dấu nháy đơn bên trong
    access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request_method $moc_duong_dan $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time "$upstream_scheme://$upstream_host$moc_duong_dan_upstream"'

# Chỉ bật plugin đang dùng
plugins:
  - request-id
  - openid-connect
  - proxy-rewrite
  - limit-count
  - fault-injection
  # F3.13: chỉ số cho Prometheus, bật toàn cục trong apisix.yaml
  - prometheus

plugin_attr:
  prometheus:
    # Cổng xuất chỉ số riêng, chỉ trong mạng nội bộ `moc` (không có trong ports của docker-compose.yml)
    export_addr:
      ip: 0.0.0.0
      port: 9091
