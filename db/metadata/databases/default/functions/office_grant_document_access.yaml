# Cấp quyền xem văn bản hạn chế (F3.7, migration 1792281601600): văn thư, lãnh đạo đơn vị gọi thẳng. Hàm tự kiểm
# vai trò, người gọi đọc được văn bản, văn bản hạn chế, người được cấp cùng đơn vị và còn hoạt động.
function:
  name: grant_document_access
  schema: office
configuration:
  exposed_as: mutation
  session_argument: hasura_session
