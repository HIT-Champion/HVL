# Đánh dấu hỏng một lần gửi liên thông còn chờ (F3.12, migration 1792281601800) khi svc-files từ chối chép vĩnh viễn —
# thử lại cũng vậy, mà dòng chờ còn chặn nộp lưu văn bản gửi. Chỉ svc-workflow gọi, phiên của bên gửi hoặc bên nhận.
