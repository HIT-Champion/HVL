# Giao một lần gửi liên thông (F3.12, migration 1792281601800): tạo văn bản đến ở đơn vị nhận trong một giao dịch, gọi
# lại thì trả nguyên dòng. Chỉ svc-workflow gọi, trong phiên của đơn vị nhận, sau khi svc-files đã chép tệp phát hành.
function:
  name: deliver_dispatch
  schema: office
configuration:
  exposed_as: mutation
  session_argument: hasura_session
permissions:
  - role: service
