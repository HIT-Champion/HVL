# Văn bản đến / đi. Quy tắc ai đọc được văn bản nào nằm ở một chỗ: hàm office.document_visible
# (migration 1792281600200), gắn vào đây thành trường `visible`; các bảng con lọc theo document.visible.
#
# Văn bản đến chỉ vào qua Action receiveIncoming (svc-workflow kiểm lại theo schemas/van-ban-den.json —
# poka-yoke lớp 2, F2.2), nên văn thư không có quyền ghi thẳng bảng này. Chuyên viên ghi trực tiếp dự thảo
# văn bản đi khi còn ở bước đầu (draft, returned). status, số, ký hiệu văn bản đi, băm, mã tra cứu, process_id
# chỉ đổi qua Hasura Actions do svc-workflow xử lý (vai trò service) — docs/mo-hinh-du-lieu.md §3, §4.
# Đơn vị nhận trong hệ thống (recipient_tenant_ids, F3.12) chuyên viên chọn lúc soạn; CSDL kiểm đơn vị có thật, không
# phải đơn vị mình, không với văn bản hạn chế, và không đổi được sau khi trình (migration 1792281601800).
table:
  name: documents
  schema: office
object_relationships:
  - name: document_type
    using:
      manual_configuration:
        remote_table: {name: document_types, schema: office}
        column_mapping: {type_code: code}
  - name: register
    using:
      manual_configuration:
        remote_table: {name: registers, schema: office}
        column_mapping: {register_id: id}
  - name: department
    using:
      manual_configuration:
        remote_table: {name: departments, schema: office}
        column_mapping: {department_id: id}
  - name: reply_to
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {reply_to_id: id}
  - name: source
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {source_id: id}
  # văn bản đến do liên thông trong hệ thống tạo ra (F3.12): lượt gửi đã sinh ra nó
  - name: dispatch_in
    using:
      manual_configuration:
        remote_table: {name: dispatches, schema: office}
        column_mapping: {id: incoming_document_id}
  # người ký văn bản đi, người tạo: danh bạ core.users (không có khóa ngoại — core không phụ thuộc office)
  - name: signer
    using:
      manual_configuration:
        remote_table: {name: users, schema: core}
        column_mapping: {signer_id: id}
  - name: creator
    using:
      manual_configuration:
        remote_table: {name: users, schema: core}
        column_mapping: {created_by: id}
array_relationships:
  - name: files
    using:
      manual_configuration:
        remote_table: {name: document_files, schema: office}
        column_mapping: {id: document_id}
  - name: assignments
    using:
      manual_configuration:
        remote_table: {name: assignments, schema: office}
        column_mapping: {id: document_id}
  - name: events
    using:
      manual_configuration:
        remote_table: {name: document_events, schema: office}
        column_mapping: {id: document_id}
  # văn bản đi gửi đơn vị khác trong hệ thống (F3.12): mỗi đơn vị nhận một dòng
  - name: dispatches
    using:
      manual_configuration:
        remote_table: {name: dispatches, schema: office}
        column_mapping: {id: document_id}
computed_fields:
  - name: visible
    definition:
      function: {name: document_visible, schema: office}
      session_argument: hasura_session
    comment: Người gọi có được đọc văn bản này không — quy tắc ở docs/mo-hinh-du-lieu.md §3
insert_permissions:
  - role: staff
    permission:
      columns: [type_code, summary, body, urgency, restricted, recipients, recipient_tenant_ids, reply_to_id]
      set:
        tenant_id: X-Hasura-Tenant-Id
        created_by: X-Hasura-User-Id
        department_id: X-Hasura-Department-Id
        direction: out
        status: draft
      check: {}
  - role: service
    permission:
      columns: [id, direction, status, type_code, symbol, issuer_name, issued_on, summary, body, urgency,
                restricted, is_public, register_id, register_number, registered_at, due_on, department_id,
                signer_id, recipients, reply_to_id, source_id, process_id, created_by]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [id, tenant_id, direction, status, type_code, symbol, issuer_name, issued_on, summary, body,
                urgency, restricted, is_public, register_id, register_number, registered_at, due_on,
                department_id, signer_id, recipients, recipient_tenant_ids, reply_to_id, content_sha256,
                verify_code, source_id, process_id, created_by, created_at, updated_at]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - visible: {_eq: true}
      allow_aggregations: true
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [id, tenant_id, direction, status, type_code, symbol, issuer_name, issued_on, summary, body,
                urgency, restricted, is_public, register_id, register_number, registered_at, due_on,
                department_id, signer_id, recipients, recipient_tenant_ids, reply_to_id, content_sha256,
                verify_code, source_id, process_id, created_by, created_at, updated_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
update_permissions:
  - role: staff
    permission:
      columns: [type_code, summary, body, urgency, restricted, recipients, recipient_tenant_ids, reply_to_id]
      filter:
        tenant_id: {_eq: X-Hasura-Tenant-Id}
        direction: {_eq: out}
        status: {_in: [draft, returned]}
        created_by: {_eq: X-Hasura-User-Id}
      check: {}
  - role: service
    permission:
      columns: [status, type_code, symbol, issuer_name, issued_on, summary, body, urgency, restricted,
                is_public, register_id, register_number, registered_at, due_on, department_id, signer_id,
                recipients, reply_to_id, content_sha256, verify_code, source_id, process_id]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
