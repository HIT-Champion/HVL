# Độ chính xác của gợi ý đọc văn bản đến (F4.1, migration 1792281601900): mỗi trường, mỗi mức tin cậy — số lần tác tử
# gợi ý và số lần văn thư giữ nguyên khi lưu, trên văn bản đến không hủy, không hạn chế. Chỉ có số đếm, không cột nào
# chứa giá trị của trường. Lãnh đạo, quản trị đơn vị đọc số của đơn vị mình.
table:
  name: v_intake_accuracy
  schema: office
select_permissions:
  - role: director
    permission: &accuracy
      columns: [field, confidence, suggested, kept]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
  - role: tenant_admin
    permission: *accuracy
