# Số đo "sau" (a) của đặc tả §8 (F4.6, migration 1792281602750): từ lúc văn bản đến tới lúc lãnh đạo giao chủ trì, và
# tới lúc văn bản tới tay người xử lý — số văn bản, trung vị, p90 (giờ), theo tháng văn bản đến; dòng month null là mọi
# tháng. Chỉ có số đếm và số giờ; văn bản hạn chế không tính. sample: đơn vị mẫu của make seed. Lãnh đạo đơn vị đọc số
# của đơn vị mình.
table:
  name: v_time_to_assign
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [tenant_id, sample, month, arrived, assigned, median_hours, p90_hours, handled, handled_median_hours,
                handled_p90_hours, waiting]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
