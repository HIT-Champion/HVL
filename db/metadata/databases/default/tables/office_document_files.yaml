# Gắn tệp vào văn bản. Người dùng chỉ gắn tệp do chính mình tải lên, vào văn bản mình còn được sửa,
# và gỡ được khi văn bản còn ở bước đó. Bản phát hành ('issued') chỉ svc-workflow gắn.
# Khóa ngoại (tenant_id, …) trong CSDL bảo đảm văn bản và tệp cùng một thuê ước.
table:
  name: document_files
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
  - name: file
    using:
      manual_configuration:
        remote_table: {name: files, schema: core}
        column_mapping: {file_id: id}
insert_permissions:
  - role: clerk
    permission:
      columns: [document_id, file_id, role]
      set:
        tenant_id: X-Hasura-Tenant-Id
        added_by: X-Hasura-User-Id
      check: &clerk_editable
        _and:
          - document: {direction: {_eq: in}, status: {_eq: received}}
          - file: {created_by: {_eq: X-Hasura-User-Id}}
          - role: {_in: [main, attachment]}
  - role: staff
    permission:
      columns: [document_id, file_id, role]
      set:
        tenant_id: X-Hasura-Tenant-Id
        added_by: X-Hasura-User-Id
      check: &staff_editable
        _and:
          - document:
              direction: {_eq: out}
              status: {_in: [draft, returned]}
              created_by: {_eq: X-Hasura-User-Id}
          - file: {created_by: {_eq: X-Hasura-User-Id}}
          - role: {_in: [draft, attachment]}
  - role: service
    permission:
      columns: [document_id, file_id, role, version, added_by]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [document_id, file_id, role, version, added_by, added_at]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - document: {visible: {_eq: true}}
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [tenant_id, document_id, file_id, role, version, added_by, added_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
delete_permissions:
  - role: clerk
    permission:
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - *clerk_editable
  - role: staff
    permission:
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - *staff_editable
