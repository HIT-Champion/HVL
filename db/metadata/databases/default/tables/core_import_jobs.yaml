# Lô nạp khối lớn (migration 1792281602800): svc-files tạo lô khi văn thư gửi tệp NDJSON/CSV qua /api/imports, vòng nền
# xử lý từng mẻ rồi đóng lô. Chỉ vai trò service của đúng đơn vị đọc và ghi (khóa quản trị + X-Hasura-Role: service +
# thuê ước của lô); lô, dòng và dòng sổ `import.created` ghi trong một mutation, `import.finished` do trigger ghi khi lô
# chuyển sang done. Vòng nền tìm lô đến giờ của mọi đơn vị bằng khóa quản trị không kèm vai trò, chỉ đọc. Không vai
# trò người dùng nào thấy bảng này: lược đồ GraphQL của họ không đổi; người tạo lô xem lô của mình qua API của
# svc-files.
table:
  name: import_jobs
  schema: core
array_relationships:
  - name: rows
    using:
      manual_configuration:
        remote_table: {name: import_rows, schema: core}
        column_mapping: {id: job_id, tenant_id: tenant_id}
insert_permissions:
  - role: service
    permission:
      columns: [id, kind, created_by, department_id, filename, format, data_sha256, archive_sha256, archive_bytes,
                options, idempotency_key, total]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: service
    permission:
      columns: [id, tenant_id, kind, created_by, department_id, status, filename, format, data_sha256, archive_sha256,
                archive_bytes, options, idempotency_key, total, ok, duplicate, failed, note, created_at, started_at,
                run_after, finished_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
update_permissions:
  - role: service
    permission:
      columns: [status, started_at, run_after, ok, duplicate, failed, note, finished_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
