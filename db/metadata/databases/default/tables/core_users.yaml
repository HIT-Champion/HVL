# Danh bạ người dùng, đồng bộ từ Keycloak (svc-workflow, vai trò service). Người trong thuê ước đọc được
# để chọn người được giao việc và hiện tên trên dòng thời gian; không ai sửa qua GraphQL.
table:
  name: users
  schema: core
insert_permissions:
  - role: service
    permission:
      columns: [id, department_id, username, full_name, email, role, enabled]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &tenant_select
      columns: [id, department_id, username, full_name, email, role, enabled]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
  - role: staff
    permission: *tenant_select
  - role: manager
    permission: *tenant_select
  - role: director
    permission: *tenant_select
  - role: tenant_admin
    permission: *tenant_select
  - role: service
    permission: *tenant_select
update_permissions:
  - role: service
    permission:
      columns: [department_id, username, full_name, email, role, enabled]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
