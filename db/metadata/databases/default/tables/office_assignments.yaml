# Ý kiến chỉ đạo và giao việc. Chỉ svc-workflow ghi, khi xử lý Action completeTask.
table:
  name: assignments
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
  - name: department
    using:
      manual_configuration:
        remote_table: {name: departments, schema: office}
        column_mapping: {department_id: id}
  - name: parent
    using:
      manual_configuration:
        remote_table: {name: assignments, schema: office}
        column_mapping: {parent_id: id}
array_relationships:
  - name: children
    using:
      manual_configuration:
        remote_table: {name: assignments, schema: office}
        column_mapping: {id: parent_id}
insert_permissions:
  - role: service
    permission:
      columns: [id, document_id, parent_id, department_id, user_id, role, instruction, due_on, status,
                result_note, assigned_by, completed_at]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [id, document_id, parent_id, department_id, user_id, role, instruction, due_on, status,
                result_note, assigned_by, assigned_at, completed_at]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - document: {visible: {_eq: true}}
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [id, tenant_id, document_id, parent_id, department_id, user_id, role, instruction, due_on,
                status, result_note, assigned_by, assigned_at, completed_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
update_permissions:
  - role: service
    permission:
      columns: [user_id, instruction, due_on, status, result_note, completed_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
