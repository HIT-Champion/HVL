# Kênh SMS, Zalo người dùng tự bật (migration 1792281603700, #365). Chỉ svc-workflow (vai trò service) đọc và ghi
# trong đơn vị của phiên: người dùng bật, tắt qua Action setMyChannel, liên kết Zalo bằng mã dùng một lần; vòng đọc
# tin của bot ghi chat_id. Vòng tìm mã liên kết trên mọi đơn vị dùng khóa quản trị (as_system, chỉ đọc). Không vai trò
# người dùng nào đọc bảng này: chat_id, mã liên kết chỉ đi qua Action.
table:
  name: notification_subscriptions
  schema: core
select_permissions:
  - role: service
    permission:
      columns: [tenant_id, user_id, channel, enabled, zalo_chat_id, link_code, link_expires_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
insert_permissions:
  - role: service
    permission:
      columns: [user_id, channel, enabled, zalo_chat_id, link_code, link_expires_at]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
update_permissions:
  - role: service
    permission:
      columns: [enabled, zalo_chat_id, link_code, link_expires_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
