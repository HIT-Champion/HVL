# Dashboard điều hành (F3.11): số văn bản đến xử lý xong, tổng số giờ từ vào sổ đến khi xong, số có hạn và số xong
# đúng hạn, theo tháng.
# Chỉ có số đếm, không cột nào chứa trích yếu, số ký hiệu hay tên người; văn bản hạn chế không vào phép chia nào
# (migration giải thích). Lãnh đạo đơn vị đọc số của đơn vị mình.
table:
  name: v_processing_time
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [tenant_id, month, documents, total_hours, with_due, on_time]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
