# Góp ý theo màn hình (F4.6, migration 1792281602750): số góp ý, tổng điểm, số góp ý mỗi mức 1–5, số có nội dung, lần
# gửi gần nhất; dòng screen null là mọi màn hình. Không có nội dung, không có người gửi. sample: đơn vị mẫu của make
# seed. Lãnh đạo, quản trị đơn vị đọc số của đơn vị mình.
table:
  name: v_feedback_summary
  schema: office
select_permissions:
  - role: director
    permission: &summary
      columns: [tenant_id, sample, screen, feedback, rating_total, rating_1, rating_2, rating_3, rating_4, rating_5,
                with_comment, last_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
  - role: tenant_admin
    permission: *summary
