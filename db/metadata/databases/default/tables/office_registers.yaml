# Sổ đăng ký văn bản. Chỉ svc-workflow cấp số (tăng last_number trong cùng giao dịch ghi văn bản);
# sổ của năm mới được tạo khi cấp số đầu tiên của năm đó.
table:
  name: registers
  schema: office
insert_permissions:
  - role: service
    permission:
      columns: [direction, year]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &tenant_select
      columns: [id, direction, year, last_number]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
  - role: director
    permission: *tenant_select
  - role: tenant_admin
    permission: *tenant_select
  - role: service
    permission: *tenant_select
update_permissions:
  - role: service
    permission:
      columns: [last_number]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
