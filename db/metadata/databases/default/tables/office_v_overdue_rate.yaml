# Số đo "sau" (b) của đặc tả §8 (F4.6, migration 1792281602750): văn bản đến có hạn giải quyết — đã rõ đúng hạn hay quá
# hạn (judged), đúng hạn, quá hạn (xong sau hạn hoặc chưa xong mà đã qua hạn), trong đó chưa xong, và số chưa tới hạn;
# theo tháng của ngày hạn, dòng month null là mọi tháng. Văn bản hạn chế không tính. sample: đơn vị mẫu của make seed.
# Lãnh đạo đơn vị đọc số của đơn vị mình.
table:
  name: v_overdue_rate
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [tenant_id, sample, month, judged, on_time, late, late_open, pending]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
