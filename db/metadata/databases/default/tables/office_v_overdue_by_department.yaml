# Dashboard điều hành (F3.11): văn bản đến đang xử lý, quá hạn theo phòng chủ trì (dòng department_id null: chưa rõ
# phòng).
# Chỉ có số đếm, không cột nào chứa trích yếu, số ký hiệu hay tên người; văn bản hạn chế không vào phép chia nào
# (migration giải thích). Lãnh đạo đơn vị đọc số của đơn vị mình.
table:
  name: v_overdue_by_department
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [tenant_id, department_id, code, name, in_progress, overdue]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
