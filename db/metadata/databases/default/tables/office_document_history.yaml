# Lịch sử thay đổi của văn bản (F3.5): dòng sổ kiểm toán về văn bản, tệp, giao việc, lần vào hồ sơ. Ai đọc được văn
# bản (computed field `visible`) thì xem được lịch sử của nó; chỉ có `overview`, không có diff đầy đủ. Mỗi lần tối đa
# 500 dòng (giao diện lấy mới nhất trước).
table:
  name: document_history
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
select_permissions:
  - role: staff
    permission: &history
      columns: [id, document_id, occurred_at, actor_id, actor_kind, action, entity, overview]
      filter:
        tenant_id: {_eq: X-Hasura-Tenant-Id}
        document: {visible: {_eq: true}}
      limit: 500
  - role: manager
    permission: *history
  - role: clerk
    permission: *history
  - role: director
    permission: *history
