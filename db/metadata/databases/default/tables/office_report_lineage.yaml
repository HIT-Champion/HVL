# Phả hệ báo cáo tổng hợp (F3.9, F3.11, migration 1792281602900): view báo cáo office.v_* đọc bảng, view nào — tính
# từ catalog PostgreSQL lúc truy vấn. Chỉ có tên đối tượng và cạnh, giống nhau cho mọi đơn vị (không có tenant_id, không
# dữ liệu nghiệp vụ, không số dòng). Lãnh đạo đơn vị đọc, cùng vai trò với dashboard điều hành.
table:
  name: report_lineage
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [report, consumer, source, source_kind, depth]
      filter: {}
