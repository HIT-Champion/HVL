# Kiểm chất lượng số liệu báo cáo (F3.9, F3.11, migration 1792281603300): luật tính trong CSDL lúc truy vấn trên các
# khung nhìn của trang Điều hành — PASSED / WARNING / FAILED kèm số liệu. Chỉ có số đếm suy được từ số lãnh đạo đã thấy
# trên trang và tên cột trong catalog. Cùng quyền với dashboard: lãnh đạo đơn vị đọc kết quả của đơn vị mình.
table:
  name: report_checks
  schema: office
select_permissions:
  - role: director
    permission:
      columns: [tenant_id, rule, report, status, expected, actual, issues, detail]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
