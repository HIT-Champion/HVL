# Gợi ý đọc văn bản đến (F4.1, migration 1792281601900): tác tử moc-doc-reader trong svc-files ghi, đọc lại khi văn
# thư bấm đọc lần nữa. Chỉ vai trò `agent` (khóa quản trị + X-Hasura-Role: agent) có quyền: thuê ước và danh tính tác
# tử đặt sẵn từ phiên, gửi lên bị từ chối; khóa ngoại (tenant_id, file_id) chặn gợi ý cho tệp của đơn vị khác. Không vai
# trò người dùng nào đọc, ghi bảng này — giao diện nhận gợi ý qua POST /api/files/{id}/read. Không ai xóa: xóa tệp thì
# gợi ý xóa theo, văn bản bật hạn chế thì trigger xóa.
table:
  name: intake_suggestions
  schema: office
# vai trò agent không đọc được core.files: quan hệ chỉ dùng với khóa quản trị
object_relationships:
  - name: file
    using:
      manual_configuration:
        remote_table: {name: files, schema: core}
        column_mapping: {file_id: id}
insert_permissions:
  - role: agent
    permission:
      columns: [file_id, requested_by, status, method, pages, fields, warnings, summary_source, model, duration_ms]
      set:
        tenant_id: X-Hasura-Tenant-Id
        agent_id: X-Hasura-User-Id
      check: {}
select_permissions:
  - role: agent
    permission:
      columns: [file_id, tenant_id, requested_by, agent_id, status, method, pages, fields, warnings, summary_source,
                model, duration_ms, read_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
# đọc lại (force): upsert theo khóa chính, ghi đè đúng các cột của lần đọc mới; read_at do trigger đặt
update_permissions:
  - role: agent
    permission:
      columns: [requested_by, status, method, pages, fields, warnings, summary_source, model, duration_ms]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      set:
        agent_id: X-Hasura-User-Id
