# Kênh ngoài của thông báo (email, webhook; migration 1792281602600): mỗi dòng là một lần gửi một thông báo qua một
# kênh. Dòng do trigger tạo lúc ghi thông báo; svc-workflow (vai trò service) đọc dòng chờ của đơn vị, ghi kết quả
# (trạng thái, số lần thử, lỗi, hạn thử lại, lúc gửi) — không thêm, không xóa. Vòng nền đọc dòng đến hạn của mọi đơn
# vị bằng khóa quản trị (as_system, chỉ đọc) kèm người nhận trong danh bạ. Không vai trò người dùng nào đọc bảng này.
table:
  name: notification_deliveries
  schema: core
object_relationships:
  - name: notification
    using:
      foreign_key_constraint_on: notification_id
  - name: recipient
    using:
      manual_configuration:
        remote_table: {name: users, schema: core}
        column_mapping: {tenant_id: tenant_id, user_id: id}
select_permissions:
  - role: service
    permission:
      columns: [id, tenant_id, notification_id, user_id, channel, status, attempts, last_error, next_attempt_at,
                sent_at, created_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
update_permissions:
  - role: service
    permission:
      columns: [status, attempts, last_error, next_attempt_at, sent_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
