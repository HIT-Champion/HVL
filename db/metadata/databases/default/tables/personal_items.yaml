# Không gian cá nhân P.A.R.A (apps/ca-nhan, migration 1792281602500_personal_space). Mỗi người chỉ thấy, chỉ xếp tệp
# của chính mình: thuê ước và chủ đặt sẵn từ token, mọi quyền lọc theo cả hai. Chỉ đổi được thư mục; không ai xóa
# (docs/mo-hinh-du-lieu.md §0) — tệp vẫn ở core.files. Trigger items_guard chặn đặt tệp người khác tải lên hay tệp mã
# hóa. Quan hệ `file` đọc core.files theo đúng quyền của vai trò ở core_files.yaml (người tải lên thấy tệp của mình);
# không thêm quan hệ ngược vào core_files.yaml: ứng dụng không sửa metadata của lõi. tenant_admin không đọc core.files
# nên không có không gian cá nhân.
table:
  name: items
  schema: personal
object_relationships:
  - name: file
    using:
      manual_configuration:
        remote_table: {name: files, schema: core}
        column_mapping: {file_id: id}
insert_permissions:
  - role: clerk
    permission: &owner_insert
      columns: [file_id, para]
      set:
        tenant_id: X-Hasura-Tenant-Id
        owner_id: X-Hasura-User-Id
      check: {}
  - role: staff
    permission: *owner_insert
  - role: manager
    permission: *owner_insert
  - role: director
    permission: *owner_insert
select_permissions:
  - role: clerk
    permission: &owner_select
      columns: [file_id, para, created_at, updated_at]
      filter: &mine
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - owner_id: {_eq: X-Hasura-User-Id}
  - role: staff
    permission: *owner_select
  - role: manager
    permission: *owner_select
  - role: director
    permission: *owner_select
update_permissions:
  - role: clerk
    permission: &owner_update
      columns: [para]
      filter: *mine
      check: *mine
  - role: staff
    permission: *owner_update
  - role: manager
    permission: *owner_update
  - role: director
    permission: *owner_update
