# Phả hệ dữ liệu (F3.9): sự kiện OpenLineage của job nộp lưu. svc-files ghi bằng khóa quản trị; không vai trò nào
# ghi, sửa được (trigger CSDL chặn sửa, xóa). Lãnh đạo đơn vị và văn thư (người quản lý hồ sơ nộp lưu) xem phả hệ của
# đơn vị mình; sự kiện không chứa tên hồ sơ hay trích yếu.
table:
  name: lineage_events
  schema: core
select_permissions:
  - role: director
    permission: &lineage
      columns: [id, run_id, parent_run_id, job, event_type, event_time, inputs, outputs, quality_ok, event]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
  - role: clerk
    permission: *lineage
