# Dòng thời gian văn bản (F2.6). svc-workflow ghi cùng lúc với mỗi bước nghiệp vụ; không ai sửa.
table:
  name: document_events
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
insert_permissions:
  - role: service
    permission:
      columns: [document_id, kind, actor_id, actor_kind, note, data]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [id, document_id, kind, actor_id, actor_kind, note, data, created_at]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - document: {visible: {_eq: true}}
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [id, tenant_id, document_id, kind, actor_id, actor_kind, note, data, created_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
