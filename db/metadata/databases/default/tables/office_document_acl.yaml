# Danh sách người được đọc văn bản hạn chế (F3.7). Hàm office.document_visible đọc bảng này trực tiếp.
# Văn thư, lãnh đạo đơn vị xem danh sách của văn bản hạn chế họ đang đọc được, thêm / gỡ qua hai hàm
# office.grant_document_access, office.revoke_document_access (không ghi thẳng bảng). Chuyên viên, trưởng phòng có
# tên trong danh sách không xem được danh sách: không biết ai khác cũng được xem.
table:
  name: document_acl
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
  - name: user
    using:
      manual_configuration:
        remote_table: {name: users, schema: core}
        column_mapping: {user_id: id}
insert_permissions:
  - role: service
    permission:
      columns: [document_id, user_id, granted_by]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &manage_select
      columns: [document_id, user_id, granted_by, granted_at]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - document: {visible: {_eq: true}}
  - role: director
    permission: *manage_select
  - role: service
    permission:
      columns: [tenant_id, document_id, user_id, granted_by, granted_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
delete_permissions:
  - role: service
    permission:
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
