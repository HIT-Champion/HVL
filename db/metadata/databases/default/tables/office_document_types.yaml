# Danh mục loại văn bản theo NĐ 30 — dùng chung cho mọi thuê ước, chỉ đổi bằng migration.
table:
  name: document_types
  schema: office
select_permissions:
  - role: clerk
    permission: &all_types
      columns: [code, name, in_symbol]
      filter: {}
  - role: staff
    permission: *all_types
  - role: manager
    permission: *all_types
  - role: director
    permission: *all_types
  - role: tenant_admin
    permission: *all_types
  - role: service
    permission: *all_types
