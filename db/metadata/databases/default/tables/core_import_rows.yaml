# Dòng của lô nạp (migration 1792281602800): dữ liệu một dòng của tệp gửi lên khi còn chờ, kết quả khi xong. Thêm cùng
# mutation với lô; khóa ngoại (job_id, tenant_id) giữ dòng cùng đơn vị với lô. Chỉ vai trò service của đúng đơn vị đọc
# và ghi kết quả — không xóa (xóa lô thì xóa dòng). Không vai trò người dùng nào thấy bảng này.
table:
  name: import_rows
  schema: core
insert_permissions:
  - role: service
    permission:
      columns: [job_id, line, data, files, status, code, message, done_at]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: service
    permission:
      columns: [job_id, tenant_id, line, data, files, status, attempts, result, code, message, fields, done_at,
                claimed_until, claim_id]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
update_permissions:
  - role: service
    permission:
      columns: [status, data, attempts, result, code, message, fields, done_at, claimed_until, claim_id]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
