# Liên thông văn bản trong hệ thống (F3.12, migration 1792281601800): mỗi dòng là một lần gửi văn bản đi tới một đơn
# vị nhận. Dòng tạo bằng trigger lúc phát hành, giao qua hàm office.deliver_dispatch — không vai trò nào thêm, xóa.
#
# Hai bên cùng thấy một dòng, mỗi bên theo văn bản của mình: bên gửi khi đọc được văn bản đi (document.visible), bên
# nhận khi đã có văn bản đến và đọc được nó (incoming.visible) — dòng còn chờ giao thì bên nhận chưa thấy. Quan hệ
# sang văn bản của bên kia vẫn trả null (quyền đọc văn bản lọc theo thuê ước); tên đơn vị lấy qua view
# office.dispatch_units: from_unit cho bên nhận, to_unit cho bên gửi. file_id, next_attempt_at, notified_at chỉ dịch vụ
# đọc. svc-workflow (vai trò service, phiên của bên gửi hoặc bên nhận) chỉ ghi số lần thử, lỗi, hạn thử lại, lúc đã báo.
table:
  name: dispatches
  schema: office
object_relationships:
  - name: document
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {document_id: id}
  - name: incoming
    using:
      manual_configuration:
        remote_table: {name: documents, schema: office}
        column_mapping: {incoming_document_id: id}
  - name: to_unit
    using:
      manual_configuration:
        remote_table: {name: dispatch_units, schema: office}
        column_mapping: {to_tenant_id: id}
  - name: from_unit
    using:
      manual_configuration:
        remote_table: {name: dispatch_units, schema: office}
        column_mapping: {tenant_id: id}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [id, tenant_id, document_id, to_tenant_id, status, incoming_document_id, source_verify_code,
                source_sha256, attempts, last_error, created_at, delivered_at]
      filter:
        _or:
          - _and:
              - tenant_id: {_eq: X-Hasura-Tenant-Id}
              - document: {visible: {_eq: true}}
          - _and:
              - to_tenant_id: {_eq: X-Hasura-Tenant-Id}
              - incoming: {visible: {_eq: true}}
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [id, tenant_id, document_id, to_tenant_id, status, file_id, incoming_document_id, source_verify_code,
                source_sha256, attempts, last_error, next_attempt_at, notified_at, delivered_at, created_at]
      filter: &either_side
        _or:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - to_tenant_id: {_eq: X-Hasura-Tenant-Id}
update_permissions:
  - role: service
    permission:
      columns: [attempts, last_error, next_attempt_at, notified_at]
      filter: *either_side
      check: *either_side
