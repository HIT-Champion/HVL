# Lãnh đạo giữ hay đổi gợi ý giao việc (F4.3, migration 1792281602100): mỗi kết quả, mỗi mức tin cậy — số gợi ý, số
# văn bản đã giao chủ trì sau lúc gợi ý, số giữ đơn vị, số giữ hạn, tổng số ngày lệch hạn. Chỉ có số đếm, không cột nào
# chứa trích yếu, số ký hiệu hay tên người. Lãnh đạo, quản trị đơn vị đọc số của đơn vị mình.
table:
  name: v_assignment_suggestion_accuracy
  schema: office
select_permissions:
  - role: director
    permission: &accuracy
      columns: [tenant_id, status, confidence, suggested, decided, kept_unit, due_compared, kept_due,
                due_abs_error_days]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
  - role: tenant_admin
    permission: *accuracy
