# Chữ ký số PAdES của bản phát hành (F4.5, chỉ minh họa; migration 1792281602200). svc-files (vai trò service) thêm
# một dòng trong cùng mutation với dòng core.files của bản phát hành đã ký (`insert_core_file_signatures { affected_rows }`
# — không cần quyền đọc). Thuê ước đặt sẵn từ phiên; khóa ngoại (tenant_id, file_id) chặn gắn chữ ký vào tệp của đơn
# vị khác. Không vai trò nào đọc bảng này: cổng xác thực đọc các cột chữ ký qua khung nhìn office.issued_documents
# (vai trò verifier). Không ai sửa, xóa.
table:
  name: file_signatures
  schema: core
insert_permissions:
  - role: service
    permission:
      columns: [file_id, level, signed_at, signer_name, ca_name, serial, cert_sha256, not_after, key_name, key_version]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
