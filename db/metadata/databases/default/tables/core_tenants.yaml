# Mỗi người chỉ thấy thuê ước của mình. Tạo thuê ước: `dxos tenant create` (Phase 3), không qua GraphQL.
table:
  name: tenants
  schema: core
select_permissions:
  - role: clerk
    permission:
      columns: [id, code, name, org_ident]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
  - role: staff
    permission:
      columns: [id, code, name, org_ident]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
  - role: manager
    permission:
      columns: [id, code, name, org_ident]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
  - role: director
    permission:
      columns: [id, code, name, org_ident]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
  - role: tenant_admin
    permission:
      columns: [id, code, name, org_ident]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
  - role: service
    permission:
      columns: [id, code, name, org_ident, created_at]
      filter: {id: {_eq: X-Hasura-Tenant-Id}}
