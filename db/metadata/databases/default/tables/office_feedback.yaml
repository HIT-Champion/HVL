# Góp ý trong Văn phòng điện tử (F4.6, migration 1792281602700_feedback). Mọi người đã đăng nhập gửi được: chỉ mức hài
# lòng, nội dung, khuôn đường dẫn màn hình; thuê ước và người gửi Hasura đặt từ token. Văn thư, chuyên viên, lãnh đạo
# phòng chỉ thấy góp ý của mình. Lãnh đạo đơn vị, quản trị đơn vị đọc mọi góp ý của đơn vị và tổng hợp, nhưng không có
# cột user_id — không biết ai gửi; trường `mine` cho mỗi người lọc góp ý của chính mình. Không ai sửa, xóa. Trigger
# feedback_guard chặn gửi dồn (3 góp ý mỗi 10 phút, 20 mỗi 24 giờ), đặt giờ gửi.
table:
  name: feedback
  schema: office
computed_fields:
  - name: mine
    definition:
      function: {name: feedback_mine, schema: office}
      session_argument: hasura_session
    comment: Góp ý này của chính người đang xem
insert_permissions:
  - role: clerk
    permission: &send
      columns: [rating, comment, screen]
      set:
        tenant_id: X-Hasura-Tenant-Id
        user_id: X-Hasura-User-Id
      check: {}
  - role: staff
    permission: *send
  - role: manager
    permission: *send
  - role: director
    permission: *send
  - role: tenant_admin
    permission: *send
select_permissions:
  - role: clerk
    permission: &own
      columns: [id, rating, comment, screen, created_at]
      computed_fields: [mine]
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - user_id: {_eq: X-Hasura-User-Id}
  - role: staff
    permission: *own
  - role: manager
    permission: *own
  - role: director
    permission: &unit
      columns: [id, rating, comment, screen, created_at]
      computed_fields: [mine]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
  - role: tenant_admin
    permission: *unit
