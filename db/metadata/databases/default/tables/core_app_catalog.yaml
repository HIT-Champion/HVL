# Danh mục ứng dụng cắm bằng manifest (migration 1792281603400, trang /ung-dung): khung nhìn hẹp trên core.apps, không
# có manifest, cổng, biến môi trường, schema. Dữ liệu toàn hệ thống — không có cột đơn vị để lọc, mọi đơn vị cùng một
# danh sách. Ai đăng nhập cũng xem ứng dụng đang cài để mở; lãnh đạo, quản trị đơn vị xem thêm băm manifest (đối chiếu
# với `sha256sum app.yaml`) và ứng dụng đã gỡ. Không vai trò nào ghi: cài, gỡ chỉ bằng `moc app` trên máy chủ.
table:
  name: app_catalog
  schema: core
select_permissions:
  - role: clerk
    permission:
      columns: [name, title, description, path, version, installed_at, updated_at]
      filter: {removed_at: {_is_null: true}}
  - role: staff
    permission:
      columns: [name, title, description, path, version, installed_at, updated_at]
      filter: {removed_at: {_is_null: true}}
  - role: manager
    permission:
      columns: [name, title, description, path, version, installed_at, updated_at]
      filter: {removed_at: {_is_null: true}}
  - role: director
    permission:
      columns: [name, title, description, path, version, installed_at, updated_at, manifest_sha256, removed_at]
      filter: {}
  - role: tenant_admin
    permission:
      columns: [name, title, description, path, version, installed_at, updated_at, manifest_sha256, removed_at]
      filter: {}
