# Mốc neo: bản tra cứu các lần svc-files chép đầu chuỗi ra bucket lạnh có khóa ghi (F2.12). svc-files ghi bằng
# khóa quản trị. Màn "Sổ kiểm toán" đọc để báo dòng nào đã được neo ra ngoài CSDL. Khi kiểm chuỗi, lệnh
# `moc audit verify` đọc mốc từ bucket chứ không tin bảng này.
#
# Sổ là một chuỗi chung cho cả nền tảng, nên mốc không thuộc riêng thuê ước nào; chỉ mở số dòng và thời điểm.
table:
  name: audit_anchors
  schema: core
select_permissions:
  - role: director
    permission: &anchors
      columns: [audit_id, anchored_at]
      filter: {}
      allow_aggregations: true
  - role: tenant_admin
    permission: *anchors
