# Tự chẩn đoán H-P-D-I (migration 1792281603100_maturity_assessments, docs/tu-chan-doan.md). Chỉ lãnh đạo đơn vị lưu và
# đọc lịch sử của đơn vị mình: gửi phiên bản bộ câu, câu trả lời, ghi chú; thuê ước và người lưu Hasura đặt từ token,
# điểm h, p, d, i và giờ lưu do CSDL đặt (trigger maturity_assessments_guard). Không đọc cột created_by: lịch sử là của
# đơn vị, ai lưu thì xem ở sổ kiểm toán. Không ai sửa, xóa. Lãnh đạo phòng làm bài trên trang nhưng không lưu.
table:
  name: maturity_assessments
  schema: office
insert_permissions:
  - role: director
    permission:
      columns: [framework, answers, note]
      set:
        tenant_id: X-Hasura-Tenant-Id
        created_by: X-Hasura-User-Id
      check: {}
select_permissions:
  - role: director
    permission:
      columns: [id, framework, answers, h, p, d, i, note, created_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      allow_aggregations: true
