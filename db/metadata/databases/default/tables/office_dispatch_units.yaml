# Đơn vị nhận để chọn khi soạn văn bản đi liên thông (F3.12, view trên core.tenants, migration 1792281601800). Người
# dùng chỉ đọc được dòng core.tenants của chính mình (core_tenants.yaml), nên danh sách đơn vị khác đi qua view này,
# chỉ có mã, tên, cơ quan chủ quản; đơn vị của người xem bị lọc ra (không tự gửi cho mình).
table:
  name: dispatch_units
  schema: office
select_permissions:
  - role: clerk
    permission: &units
      columns: [id, code, name, parent_name]
      filter: {id: {_neq: X-Hasura-Tenant-Id}}
  - role: staff
    permission: *units
  - role: manager
    permission: *units
  - role: director
    permission: *units
  # quản trị đơn vị: màn Sổ kiểm toán hiện tên đơn vị nhận thay cho id
  - role: tenant_admin
    permission: *units
  - role: service
    permission: *units
