# Tệp đã qua ClamAV. Chỉ svc-files thêm dòng (vai trò service), sau khi tệp đã nằm trong SeaweedFS.
# Người dùng thấy tệp mình vừa tải lên, và tệp gắn với văn bản mình được đọc.
# object_key và wrapped_dek không lộ ra cho người dùng: tải tệp luôn đi qua svc-files.
table:
  name: files
  schema: core
# lớp chữ của PDF (F2.7): core.file_texts không mở cho vai trò người dùng nào, nên chỉ khóa quản trị thấy trường này
object_relationships:
  - name: text
    using:
      manual_configuration:
        remote_table: {name: file_texts, schema: core}
        column_mapping: {id: file_id}
array_relationships:
  - name: document_files
    using:
      manual_configuration:
        remote_table: {name: document_files, schema: office}
        column_mapping: {id: file_id}
insert_permissions:
  - role: service
    permission:
      columns: [id, object_key, filename, mime_type, size_bytes, sha256, scanned_at, encrypted, wrapped_dek]
      set:
        tenant_id: X-Hasura-Tenant-Id
        created_by: X-Hasura-User-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &user_select
      columns: [id, filename, mime_type, size_bytes, sha256, scanned_at, encrypted, storage_tier, created_by, created_at]
      # Tệp mã hóa (văn bản hạn chế, F3.7) đã gắn vào văn bản thì chỉ theo quyền đọc văn bản: người tải lên, người
      # phát hành bị gỡ khỏi danh sách được xem thì cũng không mở được nữa
      filter:
        _and:
          - tenant_id: {_eq: X-Hasura-Tenant-Id}
          - _or:
              - _and:
                  - created_by: {_eq: X-Hasura-User-Id}
                  - _or:
                      - encrypted: {_eq: false}
                      - _not: {document_files: {}}
              - document_files: {document: {visible: {_eq: true}}}
  - role: staff
    permission: *user_select
  - role: manager
    permission: *user_select
  - role: director
    permission: *user_select
  - role: service
    permission:
      columns: [id, tenant_id, object_key, filename, mime_type, size_bytes, sha256, scanned_at, encrypted, wrapped_dek,
                storage_tier, created_by, created_at]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
