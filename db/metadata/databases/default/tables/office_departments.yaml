# Phòng ban: mọi người trong thuê ước đều đọc được; quản trị đơn vị (tenant_admin) thêm và sửa.
table:
  name: departments
  schema: office
insert_permissions:
  - role: tenant_admin
    permission:
      columns: [code, name]
      set:
        tenant_id: X-Hasura-Tenant-Id
      check: {}
select_permissions:
  - role: clerk
    permission: &tenant_select
      columns: [id, code, name]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
  - role: staff
    permission: *tenant_select
  - role: manager
    permission: *tenant_select
  - role: director
    permission: *tenant_select
  - role: tenant_admin
    permission: *tenant_select
  - role: service
    permission: *tenant_select
update_permissions:
  - role: tenant_admin
    permission:
      columns: [code, name]
      filter: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
      check: {tenant_id: {_eq: X-Hasura-Tenant-Id}}
