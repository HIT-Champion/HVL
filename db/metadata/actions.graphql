# Thao tác nghiệp vụ của Văn phòng điện tử (docs/mo-hinh-du-lieu.md §4.1). Hasura chuyển sang svc-workflow
# kèm biến phiên lấy từ JWT; svc-workflow không tin thuê ước hay người dùng do client gửi.

type Mutation {
  "Văn thư vào sổ văn bản đến: cấp số đến, khởi chạy quy trình van-ban-den"
  registerIncoming(documentId: uuid!): RegisterIncomingOutput
}

type Mutation {
  "Hoàn thành một việc trong hộp việc; data kiểm theo formKey của việc"
  completeTask(taskId: String!, outcome: String!, data: jsonb): CompleteTaskOutput
}

type Query {
  "Hộp việc của người gọi: việc giao đích danh và việc của nhóm vai trò của họ, khẩn xếp trước"
  myTasks: [WorkTask!]!
}

type RegisterIncomingOutput {
  document_id: uuid!
  register_number: Int!
}

type CompleteTaskOutput {
  task_id: String!
  document_id: uuid!
}

type WorkTask {
  id: String!
  name: String!
  form_key: String!
  document_id: uuid!
  created_at: timestamptz!
  due_on: date
  urgency: String!
}
