# Thao tác nghiệp vụ của Văn phòng điện tử (docs/mo-hinh-du-lieu.md §4.1). Hasura chuyển sang svc-workflow
# kèm biến phiên lấy từ JWT; svc-workflow không tin thuê ước hay người dùng do client gửi.

type Mutation {
  "Văn thư tiếp nhận văn bản đến (trạng thái received); data đúng schemas/van-ban-den.json, kèm file_ids đã quét"
  receiveIncoming(data: jsonb!): ReceiveIncomingOutput
}

type Mutation {
  "Văn thư vào sổ văn bản đến: cấp số đến, khởi chạy quy trình van-ban-den"
  registerIncoming(documentId: uuid!): RegisterIncomingOutput
}

type Mutation {
  "Người soạn trình dự thảo văn bản đi (lần đầu hoặc sau khi sửa), chọn lãnh đạo đơn vị ký"
  submitOutgoing(documentId: uuid!, signerId: String!): SubmitOutgoingOutput
}

type Mutation {
  "Hoàn thành một việc trong hộp việc; data kiểm theo formKey của việc"
  completeTask(taskId: String!, outcome: String!, data: jsonb): CompleteTaskOutput
}

type Query {
  "Hộp việc của người gọi: việc giao đích danh và việc của nhóm vai trò của họ, khẩn xếp trước"
  myTasks: [WorkTask!]!
}

type Query {
  "Sơ đồ cảm biến OT của đơn vị người gọi: số đo mới nhất từng cảm biến, ngưỡng, cờ chất lượng dữ liệu (F3.10)"
  otSensorMap: OtSensorMap!
}

type Query {
  "Kênh SMS, Zalo bản cài đã cấu hình cho thông báo, kèm trạng thái của người gọi; rỗng khi chưa cấu hình kênh nào"
  myChannels: [MyChannel!]!
}

type Mutation {
  "Người gọi bật, tắt kênh SMS hoặc Zalo cho thông báo của mình. Bật Zalo khi chưa liên kết: nhận mã để nhắn cho bot"
  setMyChannel(channel: String!, enabled: Boolean!): [MyChannel!]!
}

type Mutation {
  "Robot của flow Node-RED (#366) báo người trong đơn vị mình theo vai trò (flow.message); cùng khóa thì không báo lại"
  notifyFromFlow(
    roles: [String!]!, title: String!, text: String, document_id: uuid, key: String!
  ): NotifyFromFlowOutput!
}

type ReceiveIncomingOutput {
  document_id: uuid!
}

type RegisterIncomingOutput {
  document_id: uuid!
  register_number: Int!
}

type SubmitOutgoingOutput {
  document_id: uuid!
  status: String!
}

type CompleteTaskOutput {
  task_id: String!
  document_id: uuid!
}

type WorkTask {
  id: String!
  name: String!
  form_key: String!
  document_id: uuid!
  created_at: timestamptz!
  due_on: date
  urgency: String!
}

# status: ready (broker trả lời) | off (chưa đặt MOC_NGSI_URL) | unavailable (broker không trả lời, vd chưa bật
# profile iot). flags của từng cảm biến: stale, out_of_range, duplicate_time, future_time — luật ở sensor_view
# (services/svc-workflow/src/svc_workflow/ot.py)
type OtSensorMap {
  status: String!
  threshold: Float!
  stale_after_min: Int!
  range_min: Float!
  range_max: Float!
  checked_at: timestamptz!
  sensors: [OtSensor!]!
}

type OtSensor {
  id: String!
  room: String
  name: String!
  value: Float
  observed_at: timestamptz
  flags: [String!]!
}

"Kết quả notifyFromFlow: số người vừa nhận thông báo (người đã có thông báo cùng khóa không tính)"
type NotifyFromFlowOutput {
  sent: Int!
}

"Một kênh thông báo người dùng tự bật (#365)"
type MyChannel {
  "sms hoặc zalo"
  channel: String!
  "Người gọi đã bật; Zalo bật nghĩa là đã liên kết"
  enabled: Boolean!
  "SMS: số trong danh bạ đã che, còn mã nước và ba số cuối; null khi danh bạ chưa có số (quản trị thêm)"
  phone: String
  "Zalo chưa liên kết: mã dùng một lần để nhắn cho bot"
  link_code: String
  link_expires_at: timestamptz
  "Zalo: địa chỉ mở bot của đơn vị (MOC_ZALO_BOT_URL), nếu có"
  bot_url: String
}
