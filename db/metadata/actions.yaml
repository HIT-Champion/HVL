# Handler là svc-workflow trong mạng nội bộ. Hasura gửi kèm X-Moc-Action-Secret để svc-workflow chỉ nhận
# yêu cầu từ Hasura; X-Request-Id của client được chuyển tiếp để nối nhật ký.
actions:
  - name: receiveIncoming
    definition:
      kind: synchronous
      handler: '{{MOC_WORKFLOW_URL}}/actions/receiveIncoming'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      timeout: 30
    permissions:
      - role: clerk
  - name: registerIncoming
    definition:
      kind: synchronous
      handler: '{{MOC_WORKFLOW_URL}}/actions/registerIncoming'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      timeout: 30
    permissions:
      - role: clerk
  - name: submitOutgoing
    definition:
      kind: synchronous
      handler: '{{MOC_WORKFLOW_URL}}/actions/submitOutgoing'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      timeout: 30
    permissions:
      - role: staff
  - name: completeTask
    definition:
      kind: synchronous
      handler: '{{MOC_WORKFLOW_URL}}/actions/completeTask'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      # phát hành = cấp số + dựng PDF + quét ClamAV + lưu kho; máy chậm có thể quá 30 giây. Cổng (APISIX) chờ Hasura
      # 100 giây, dài hơn số này: hết giờ thì người dùng thấy lỗi của Hasura, không phải 504 của cổng
      timeout: 90
    permissions:
      - role: clerk
      - role: staff
      - role: manager
      - role: director
  - name: myTasks
    definition:
      kind: ""
      handler: '{{MOC_WORKFLOW_URL}}/actions/myTasks'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      timeout: 15
      type: query
    permissions:
      - role: clerk
      - role: staff
      - role: manager
      - role: director
  # Sơ đồ cảm biến OT (F3.10), chỉ đọc: svc-workflow đọc broker NGSI-LD ở tenant của đơn vị trong phiên. Đúng các vai
  # trò đọc được dự thảo "Báo cáo sự cố" (quản trị đơn vị không đọc văn bản nào)
  - name: otSensorMap
    definition:
      kind: ""
      handler: '{{MOC_WORKFLOW_URL}}/actions/otSensorMap'
      forward_client_headers: true
      headers:
        - name: X-Moc-Action-Secret
          value_from_env: MOC_ACTION_SECRET
      timeout: 15
      type: query
    permissions:
      - role: clerk
      - role: staff
      - role: manager
      - role: director
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: ReceiveIncomingOutput
      relationships:
        - name: document
          type: object
          source: default
          remote_table: {schema: office, name: documents}
          field_mapping: {document_id: id}
    - name: RegisterIncomingOutput
      relationships:
        - name: document
          type: object
          source: default
          remote_table: {schema: office, name: documents}
          field_mapping: {document_id: id}
    - name: SubmitOutgoingOutput
      relationships:
        - name: document
          type: object
          source: default
          remote_table: {schema: office, name: documents}
          field_mapping: {document_id: id}
    - name: CompleteTaskOutput
      relationships:
        - name: document
          type: object
          source: default
          remote_table: {schema: office, name: documents}
          field_mapping: {document_id: id}
    - name: WorkTask
      relationships:
        - name: document
          type: object
          source: default
          remote_table: {schema: office, name: documents}
          field_mapping: {document_id: id}
    - name: OtSensorMap
    - name: OtSensor
  scalars: []
