# Sinh bản phát hành khi đẩy thẻ phiên bản.
# Gói nguồn dùng định dạng MỞ .tar.gz (tiêu chí PoF #3 trừ điểm nếu dùng .zip/.rar).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Phát hành gói nguồn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xác định phiên bản
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sinh gói nguồn .tar.gz
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="dx-lab-$V/" \
                      -o "dist/dx-lab-$V.tar.gz" "$GITHUB_REF_NAME"
          ( cd dist && sha256sum "dx-lab-$V.tar.gz" > "dx-lab-$V.tar.gz.sha256" )

      - name: Trích ghi chú phát hành từ CHANGELOG
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/           { exit }
            p                       { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md \
            || echo "Xem CHANGELOG.md để biết chi tiết thay đổi." > dist/RELEASE_NOTES.md

      - name: Tạo bản phát hành trên GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
