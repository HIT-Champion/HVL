# Kiểm quy trình của pull request theo docs/git_flow.md (scripts/check_pr.py): nhánh nguồn, tiêu đề, và main chỉ nhận PR
# phát hành. Tách khỏi CI để sửa tiêu đề, mô tả PR (sự kiện edited) chỉ chạy lại bước vài giây này, không dựng lại cả
# hệ thống. Ruleset của develop và main bắt buộc job này xanh.
name: PR

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flow:
    name: Quy trình nhánh và tiêu đề PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR vào main cần danh sách thẻ để biết phiên bản đã phát hành chưa
          fetch-depth: 0

      # Tiêu đề, mô tả do người mở PR đặt: đưa qua biến môi trường, không chèn ${{ }} vào lệnh shell
      - name: Nhánh nguồn, tiêu đề, PR vào main chỉ để phát hành
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr.py
