          make audit

      # Dừng bản chạy trong thư mục mã nguồn, cài sang thư mục khác rồi chạy lại từ đó (dùng chung dữ liệu). Kiểm nhanh
      # bằng script của bản cài: cổng, trạng thái, đăng nhập, GraphQL, tải tệp; bước GitOps ngay sau chạy smoke đủ trên
      # cùng bản cài này
      - name: Cài ra ngoài thư mục mã nguồn và chạy từ đó (make install)
        if: matrix.phan == 'cai-dat'
        run: |
          make down
          make install PREFIX="$RUNNER_TEMP/moc"
          cd "$RUNNER_TEMP/moc"
          docker compose up -d --wait --wait-timeout 600
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from moc_env import PUBLIC_URL, Session, call_json, text_pdf
          status, _ = call_json("GET", f"{PUBLIC_URL}/api/status")
          assert status["status"] in ("ok", "degraded"), status
          clerk = Session("vanthu")
          clerk.gql("{ office_documents(limit: 1) { id } }")
          stored = clerk.upload("sau-khi-cai.pdf", text_pdf("Kiem nhanh sau khi cai"))
          print(f"bản cài {status['version']} ({status['status']}): đăng nhập, GraphQL, tải tệp đạt,"
                f" SHA-256 {stored['sha256'][:16]}…")
          PY

      # F3.3 GitOps với repo git cục bộ: nhánh deploy là trạng thái mong muốn của bản cài. Reconciler áp commit mới
      # được đẩy lên, rồi đưa tệp đã cài bị sửa tay về đúng commit đó; smoke lại sau cùng
      - name: GitOps — reconciler áp commit mới, sửa lệch cấu hình (scripts/reconcile.py)
        if: matrix.phan == 'cai-dat'
        run: |
          G="git -c user.name=ci -c user.email=ci@localhost"
          git init -q --bare "$RUNNER_TEMP/moc.git"
          git push -q "$RUNNER_TEMP/moc.git" HEAD:refs/heads/deploy
          git clone -q -b deploy "$RUNNER_TEMP/moc.git" "$RUNNER_TEMP/moc-src"
          cd "$RUNNER_TEMP/moc"
          printf 'MOC_GITOPS_DIR=%s\n' "$RUNNER_TEMP/moc-src" >> .env
          python3 scripts/reconcile.py
          out=$(python3 scripts/reconcile.py)
          grep -q 'không có gì phải làm' <<<"$out"
          git clone -q -b deploy "$RUNNER_TEMP/moc.git" "$RUNNER_TEMP/dev"
          echo "<!-- GitOps CI $GITHUB_RUN_ID -->" >> "$RUNNER_TEMP/dev/README.md"
          $G -C "$RUNNER_TEMP/dev" commit -qam "ci: commit thử GitOps"
          git -C "$RUNNER_TEMP/dev" push -q
          out=$(python3 scripts/reconcile.py)
          grep -q 'áp commit' <<<"$out"
          grep -q "$(git -C "$RUNNER_TEMP/dev" rev-parse --short HEAD)" VERSION
          echo '# sửa tay' >> docker-compose.yml
          out=$(python3 scripts/reconcile.py)
          grep -q 'sửa tay' <<<"$out"
          if grep -q '^# sửa tay' docker-compose.yml; then exit 1; fi
          MOC_SLA_DURATION=PT24H python3 scripts/smoke.py

      # F1.9 (#261): kiểm như docs/trien-khai.md bước 6, từ ngoài vào qua proxy — kiem_ban_online.py: chứng chỉ, HTTP
      # sang HTTPS, /api/status, issuer và token_endpoint của Keycloak sau proxy, header bảo mật; smoke trọn qua
      # https:// (đăng nhập, tải tệp, thông báo qua wss://); APISIX tin X-Forwarded-For của proxy nên nhật ký ghi IP
      # của máy gọi, không phải gateway của mạng Docker
      - name: HTTPS sau proxy TLS — kiểm như docs/trien-khai.md bước 6, smoke qua https://
        if: matrix.phan == 'https'
        run: |
          python3 scripts/kiem_ban_online.py https://signet.test
          MOC_SLA_DURATION=PT24H python3 scripts/smoke.py
          ua="moc-ci-https-$GITHUB_RUN_ID"
          curl -fsS --cacert "$RUNNER_TEMP/https/ca.pem" -A "$ua" -o /dev/null https://signet.test/api/status
          # APISIX ghi nhật ký truy cập có đệm (buffer=16384 flush=3 trong mẫu nginx của nó): chờ dòng ra tới 15 giây
          line=
          for _ in $(seq 1 15); do
            line=$($COMPOSE logs --no-color --no-log-prefix --tail 1000 apisix | grep -F "\"$ua\"" | tail -1)
            [ -n "$line" ] && break
            sleep 1
          done
          echo "nhật ký APISIX: ${line%% *} …"
          test "${line%% *}" = 127.0.0.1

      - name: Trạng thái và nhật ký dịch vụ khi lỗi
        if: failure()
        run: |
          $COMPOSE ps -a || true
          mkdir -p ci-logs
          for s in $($COMPOSE config --services); do
            $COMPOSE logs --no-color --tail=1000 "$s" > "ci-logs/$s.log" 2>&1 || true
          done
          # Vector, Parseable (profile logs) và proxy TLS của phần https không có trong $COMPOSE: lấy theo tên container
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^moc-(vector|parseable)-1$|^moc-https-proxy$'); do
            docker logs --tail=1000 "$c" > "ci-logs/$c.log" 2>&1 || true
          done
          tail -n 30 ci-logs/*.log

      - name: Lưu nhật ký và vết Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ matrix.phan }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Đúng tên job mà ruleset yêu cầu (.github/rulesets/): đạt khi cả sáu phần đạt, hoặc khi PR chỉ đổi tài liệu
  stack:
    name: "Chạy thử toàn hệ thống (PoF #4)"
    needs: [thay-doi, chay-thu]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cả sáu phần chạy thử đều đạt
        env:
          MA: ${{ needs.thay-doi.outputs.ma }}
          THAY_DOI: ${{ needs.thay-doi.result }}
          CHAY_THU: ${{ needs.chay-thu.result }}
        run: |
          echo "phạm vi: $THAY_DOI, đổi ngoài tài liệu: $MA, chạy thử: $CHAY_THU"
          test "$THAY_DOI" = success
          if [ "$MA" = true ]; then test "$CHAY_THU" = success; else test "$CHAY_THU" = skipped; fi

  security:
    name: Quét bí mật và lỗ hổng phụ thuộc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Không lộ bí mật trong lịch sử commit (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --redact --no-banner -v /repo

      # Lỗ hổng chấp nhận tạm có lý do và hạn xem lại nằm trong osv-scanner.toml cạnh tệp khóa
      - name: Không dùng phụ thuộc có lỗ hổng đã biết (OSV-Scanner)
        run: docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER_IMAGE" scan source -r /src
