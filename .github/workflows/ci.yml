# Kiểm tra tự động trên mọi thay đổi: điều kiện chấm điểm PoF, test đơn vị, schema và quyền trên CSDL
# thật, dựng toàn bộ hệ thống rồi chạy seed → smoke → e2e, quét bí mật và lỗ hổng phụ thuộc.
# Action ngoài ghim theo SHA commit, image công cụ ghim theo digest — đổi phiên bản thì đổi cả hai.
# Máy chạy ghim ubuntu-24.04 (ubuntu-latest chuyển sang Ubuntu 26 từ 19/10/2026); chỉ đổi sau khi đã chạy thử.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR đẩy commit mới thì hủy lượt chạy cũ; trên main thì chạy đủ mọi commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa

jobs:
  license:
    name: Giấy phép (PoF #2)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Có bản sao toàn văn giấy phép
        run: |
          test -f LICENSE || { echo "::error::Thiếu tệp LICENSE (toàn văn giấy phép)"; exit 1; }
          grep -q "Apache License" LICENSE || { echo "::error::LICENSE không phải Apache-2.0"; exit 1; }
          test -f NOTICE || { echo "::error::Thiếu NOTICE (thông báo mục đích giấy phép)"; exit 1; }

      - name: Header giấy phép trong từng tệp mã
        run: ./scripts/license-header.sh check

      - name: Không bundle mã nguồn dự án khác
        run: |
          for d in vendor third_party node_modules; do
            if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
              echo "::error::Phát hiện thư mục bundle '$d' được commit — vi phạm tiêu chí PoF #5"
              exit 1
            fi
          done
          echo "Không có mã nguồn dự án khác bị bundle vào kho."

  build:
    name: Dựng từ mã nguồn (PoF #4)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cấu hình được trước khi dựng, không sửa tệp mã
        run: cp .env.example .env

      - name: Cú pháp Docker Compose hợp lệ
        run: docker compose config -q

      - name: Mọi profile đều phân giải được và có dịch vụ
        run: |
          for p in core app iot iot-sim ai ai-pull; do
            services=$(docker compose --profile "$p" config --services) \
              || { echo "::error::Profile '$p' không hợp lệ"; exit 1; }
            test -n "$services" || { echo "::error::Profile '$p' không có dịch vụ nào"; exit 1; }
            echo "profile $p: $(wc -w <<<"$services") dịch vụ"
          done

      - name: Script khả thi và đúng cú pháp
        run: |
          for f in scripts/*.sh db/tests/stack.sh; do
            bash -n "$f" || { echo "::error::Lỗi cú pháp: $f"; exit 1; }
            test -x "$f" || { echo "::error::Thiếu quyền thực thi: $f"; exit 1; }
          done

      - name: Workflow GitHub Actions hợp lệ (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

  docs:
    name: Tài liệu (PoF #6)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Có đủ tài liệu bắt buộc
        run: |
          for f in README.md CHANGELOG.md CONTRIBUTING.md DEPENDENCIES.md; do
            test -f "$f" || { echo "::error::Thiếu $f"; exit 1; }
          done
          echo "Đủ tài liệu bắt buộc."

      - name: CHANGELOG có mục cho thay đổi chưa phát hành
        run: |
          grep -q "## \[Chưa phát hành\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md thiếu mục [Chưa phát hành]"; exit 1; }

  unit:
    name: Test đơn vị dịch vụ và kiểm form
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python khớp image của dịch vụ (python:3.13-slim); thư viện cài theo băm trong requirements-dev.txt
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"
          cache-suffix: unit

      # Node khớp image dựng giao diện (node:24-slim); Ajv biên dịch schemas/ thành mã kiểm form
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: apps/office/package-lock.json

      - name: Thư viện giao diện theo package-lock.json
        working-directory: apps/office
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: svc-files, svc-workflow, kiểm form theo schemas/ (make test)
        run: make test

  db:
    name: Schema và quyền trên CSDL thật
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"
          cache-suffix: db

      - name: Dựng PostgreSQL + Hasura, nạp migrations và metadata từ db/
        run: db/tests/stack.sh up

      - name: Schema, quyền theo đơn vị, vào sổ đến, chuỗi băm kiểm toán
        working-directory: db/tests
        env:
          MOC_IT: "1"
        run: uv run --no-project --with-requirements requirements.txt python -m pytest -q

      - name: Nhật ký Hasura khi lỗi
        if: failure()
        run: docker logs --tail 200 moc-db-it-hasura || true

  stack:
    name: Chạy thử toàn hệ thống (PoF #4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # gồm cả profile iot: khi lỗi, nhật ký có cả broker NGSI-LD (màn IT/OT tự bật profile này)
      COMPOSE: docker compose --profile core --profile app --profile iot
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Thời hạn mỗi bước rút còn 20 giây để make smoke chờ được timer nhắc hạn và báo lãnh đạo (≈ 1 phút)
      MOC_SLA_DURATION: PT20S
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bước GitOps đẩy HEAD sang một repo git mới: bản sao nông (mặc định) bị từ chối "shallow update not allowed"
          fetch-depth: 0

      # Không bắt buộc: chỉ cần khi Docker Hub giới hạn lượt tải ẩn danh. Đặt biến DOCKERHUB_USERNAME và
      # secret DOCKERHUB_TOKEN (token chỉ đọc) trong Settings → Secrets and variables → Actions.
      - name: Đăng nhập Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Đi đúng các bước README hướng dẫn người dùng mới
      - name: Sinh cấu hình (make env)
        run: make env

      - name: Dựng image và khởi động lõi + ứng dụng (make up)
        run: make up

      - name: Nạp dữ liệu mẫu (make seed)
        run: make seed

      # Xuất lại schema GraphQL theo vai trò và OpenAPI từ hệ thống vừa dựng, so với docs/api/ trong commit
      - name: Tài liệu API trong docs/api/ khớp mã (make api-docs)
        run: python3 scripts/api_docs.py --check

      - name: Luồng chính qua cổng APISIX, EICAR bị chặn (make smoke)
        run: make smoke

      - name: Văn bản đến, văn bản đi, thông báo realtime trên trình duyệt thật (make e2e)
        run: make e2e

      # F3.7: tệp văn bản hạn chế mã hóa trong kho bằng khóa từ két; người nhận việc tự có tên trong danh sách được
      # xem, người khác 404; bản mở ra có dấu tên người xem, vào sổ kiểm toán; thông báo không mang nội dung
      - name: Văn bản hạn chế (make demo-han-che)
        run: make demo-han-che

      # F3.2: svc-files, svc-workflow không có bí mật trong biến môi trường; khởi động lại két → tự mở khóa (static
      # seal), svc-files khởi động lại lấy lại khóa kho từ két và nhận tệp; AppRole không đọc chéo bí mật
      - name: Két bí mật tự mở khóa, dịch vụ lấy bí mật qua AppRole (make demo-ket-bi-mat)
        run: make demo-ket-bi-mat

      # F3.3: xóa hẳn container svc-files, dừng centrifugo → một lượt reconciler dựng lại đúng khai báo, tải tệp được
      - name: Tự phục hồi sau khi xóa container (make demo-tu-phuc-hoi)
        run: make demo-tu-phuc-hoi

      # F3.8: lập hồ sơ, đóng, nộp lưu ngay → gói Parquet + tệp + manifest trong bucket lạnh khóa ghi, chi tiết rời CSDL;
      # văn bản vẫn tìm thấy, cổng xác thực vẫn "khớp", phòng đọc kiểm băm; xóa gói bị từ chối. Chạy trước diễn tập
      # sao lưu để bản sao lưu có cả hồ sơ đã nộp lưu
      - name: Nộp lưu hồ sơ nóng → lạnh (make demo-nong-lanh)
        run: make demo-nong-lanh

      # F3.9: lượt nộp lưu vừa rồi có run OpenLineage cho từng bước trong core.lineage_events; gói truy ngược về bảng
      # nghiệp vụ; bảng Parquet nào cũng đã qua kiểm số dòng và null
      - name: Phả hệ và kiểm chất lượng (make demo-pha-he)
        run: make demo-pha-he

      # F3.10: bật profile iot (Scorpio + PostGIS); cảm biến giả lập vượt ngưỡng → đúng một dự thảo "Báo cáo sự cố"
      # cho chuyên viên phụ trách, trình được vào luồng văn bản đi; thông báo giả sai token bị từ chối
      - name: Hội tụ IT/OT (make demo-it-ot)
        run: make demo-it-ot

      # F3.12: CNTT phát hành văn bản đi có Khoa Kinh tế trong đơn vị nhận → KT tự có văn bản đến cùng hash, cổng xác
      # thực "khớp", vào sổ được; mỗi đơn vị chỉ thấy sổ kiểm toán của mình; văn bản hạn chế không gửi liên thông được
      - name: Liên thông văn bản trong hệ thống (make demo-lien-thong)
        run: make demo-lien-thong

      # F3.12: thêm đơn vị thứ ba bằng một lệnh (CSDL, Organization, quản trị đơn vị); chạy lại không tạo gì mới, không
      # đặt lại mật khẩu; đối chiếu khớp. Mật khẩu tạm không ra nhật ký CI
      - name: Thêm đơn vị bằng một lệnh (moc tenant create, check)
        run: |
          create() {
            python3 scripts/moc.py tenant create --code KTCK --name "Khoa Cơ khí" --department "VP=Văn phòng khoa" \
              --department "ĐT=Tổ Đào tạo" --admin quantrick --admin-name "Lê Văn Cường" "$@" | sed '/Mật khẩu tạm/d'
          }
          create --dry-run
          create
          out=$(create)
          echo "$out"
          if grep -q 'tạo mới\|đặt lại' <<<"$out"; then echo "chạy lại mà vẫn tạo mới hoặc đặt lại mật khẩu"; exit 1; fi
          python3 scripts/moc.py tenant list
          python3 scripts/moc.py tenant check

      # F4.1: văn thư tải công văn PDF có chữ → tác tử moc-doc-reader gợi ý số ký hiệu, ngày, cơ quan, loại, trích yếu;
      # ảnh chụp → nhận dạng chữ (Tesseract); văn thư sửa một ô rồi vào sổ; sổ kiểm toán có dòng của tác tử, không mang
      # nội dung; tệp văn bản hạn chế bị từ chối, không có gợi ý nào được lưu. Không bật profile ai: trích yếu theo quy tắc
      - name: Đọc văn bản đến (make demo-doc-van-ban)
        run: make demo-doc-van-ban

      # F4.1: đo độ chính xác trên bộ văn bản mẫu có nhãn; chỉ đỏ khi PDF có chữ dưới ngưỡng, ảnh scan chỉ in số đo
      - name: Đo độ chính xác đọc văn bản đến (make do-doc-van-ban)
        run: make do-doc-van-ban

      # F4.2: nạp kho văn bản mẫu nhiều trang → văn thư hỏi, nhận câu trích nguyên văn kèm "số ký hiệu · tr. n"; giảng
      # viên phòng khác hỏi cùng câu → không tìm thấy; nội dung văn bản hạn chế không ai hỏi ra; sổ kiểm toán có dòng
      # của tác tử moc-assistant, không mang câu hỏi. Không bật profile ai: tìm theo từ khóa, trả lời bằng câu trích
      - name: Hỏi đáp trên kho văn bản (make demo-hoi-dap)
        run: make demo-hoi-dap

      # F4.2: chạy mọi câu hỏi có đáp án của bộ mẫu; đỏ khi câu về quyền hay văn bản hạn chế ra nguồn bị cấm, hoặc
      # recall@3 của câu dương dưới ngưỡng
      - name: Đo chất lượng hỏi đáp (make do-hoi-dap)
        run: make do-hoi-dap

      # F4.3: nạp lịch sử giao việc mẫu → văn bản đến mới có gợi ý đơn vị chủ trì, hạn, căn cứ trước khi lãnh đạo mở
      # việc chỉ đạo; dùng gợi ý thì số "giữ gợi ý" tăng đúng 1; văn bản hạn chế không có gợi ý, không làm căn cứ; sổ
      # kiểm toán có dòng của tác tử moc-assigner, không mang trích yếu; dừng svc-files thì văn bản vẫn tới lãnh đạo
      # ngay, gợi ý ghi failed (bước này luôn khởi động lại svc-files). Không bật profile ai: tìm theo từ khóa, bỏ phiếu
      - name: Gợi ý giao việc (make demo-giao-viec)
        run: make demo-giao-viec

      # F4.3: bỏ một ra (leave-one-out) trên lịch sử giao việc mẫu: top-1/2/3, độ phủ, sai số hạn, độ trễ; đỏ khi căn cứ
      # có văn bản hạn chế hoặc top-1 dưới ngưỡng
      - name: Đo gợi ý giao việc (make do-giao-viec)
        run: make do-giao-viec

      # F4.5 (chỉ minh họa): két trong CI luôn mới nên setup() đã dựng PKI nội bộ → văn bản đi phát hành có chữ ký
      # PAdES bằng khóa transit của đơn vị, băm khớp content_sha256, cổng xác thực trả signature (illustrative);
      # pyHanko trong svc-files kiểm chữ ký hợp lệ, sửa sau khi ký hay lật một byte trong phần đã ký đều bị bắt;
      # không có chữ ký nào gắn với văn bản hạn chế. Trước bước sao lưu: khôi phục mang cả CA và khóa ký về cùng két
      - name: Ký số văn bản đi, chỉ minh họa (make demo-ky-so)
        run: make demo-ky-so

      # F4.4: văn thư tải một lá đơn giả lập có số CCCD, số điện thoại, email, số tài khoản → tìm theo số CCCD ra đúng
      # đơn, trợ lý trích nguyên văn có đúng số điện thoại (người được xem văn bản thấy bản gốc); tệp EICAR tên có số
      # điện thoại bị chặn, sổ kiểm toán giữ tên gốc; nhật ký apisix, app-office, svc-files, svc-workflow từ lúc bắt
      # đầu màn không còn giá trị nào ở mọi cách viết, dòng truy cập không còn chuỗi truy vấn. Không bật profile ai: in
      # bản che mô hình sẽ nhận. Đo trên kho mẫu và đột biến mã (make do-che-pii) đã chạy trong make test
      - name: Che thông tin cá nhân trong nhật ký và chữ gửi mô hình (make demo-che-pii)
        run: make demo-che-pii

      # Diễn tập khôi phục (F3.4): hai lượt sao lưu (lượt sau chỉ thêm phần đổi, giữ lượt mới nhất), XÓA volume CSDL,
      # tệp và két, khôi phục rồi kiểm lại: luồng chính chạy, tệp mã hóa từ trước khi xóa vẫn mở được (két về cùng),
      # sổ kiểm toán khớp mốc neo trong bucket lạnh vừa khôi phục
      - name: Sao lưu, xóa dữ liệu, khôi phục rồi kiểm lại (make backup, make restore)
        run: |
          make backup
          python3 scripts/moc.py backup create --keep 1
          python3 scripts/moc.py backup list --json | python3 -c 'import json, sys
          runs = json.load(sys.stdin)["runs"]
          assert len(runs) == 1 and runs[0]["complete"], runs'
          make down
          docker volume rm moc_postgres_data moc_seaweedfs_data moc_openbao_data
          python3 scripts/moc.py backup restore --yes
          make smoke
          make audit

      # Dừng bản chạy trong thư mục mã nguồn, cài sang thư mục khác rồi chạy lại từ đó (dùng chung dữ liệu)
      - name: Cài ra ngoài thư mục mã nguồn và chạy từ đó (make install)
        run: |
          make down
          make install PREFIX="$RUNNER_TEMP/moc"
          cd "$RUNNER_TEMP/moc"
          docker compose up -d --wait --wait-timeout 600
          python3 scripts/smoke.py

      # F3.3 GitOps với repo git cục bộ: nhánh deploy là trạng thái mong muốn của bản cài. Reconciler áp commit mới
      # được đẩy lên, rồi đưa tệp đã cài bị sửa tay về đúng commit đó; smoke lại sau cùng
      - name: GitOps — reconciler áp commit mới, sửa lệch cấu hình (scripts/reconcile.py)
        run: |
          G="git -c user.name=ci -c user.email=ci@localhost"
          git init -q --bare "$RUNNER_TEMP/moc.git"
          git push -q "$RUNNER_TEMP/moc.git" HEAD:refs/heads/deploy
          git clone -q -b deploy "$RUNNER_TEMP/moc.git" "$RUNNER_TEMP/moc-src"
          cd "$RUNNER_TEMP/moc"
          printf 'MOC_GITOPS_DIR=%s\n' "$RUNNER_TEMP/moc-src" >> .env
          python3 scripts/reconcile.py
          out=$(python3 scripts/reconcile.py)
          grep -q 'không có gì phải làm' <<<"$out"
          git clone -q -b deploy "$RUNNER_TEMP/moc.git" "$RUNNER_TEMP/dev"
          echo "<!-- GitOps CI $GITHUB_RUN_ID -->" >> "$RUNNER_TEMP/dev/README.md"
          $G -C "$RUNNER_TEMP/dev" commit -qam "ci: commit thử GitOps"
          git -C "$RUNNER_TEMP/dev" push -q
          out=$(python3 scripts/reconcile.py)
          grep -q 'áp commit' <<<"$out"
          grep -q "$(git -C "$RUNNER_TEMP/dev" rev-parse --short HEAD)" VERSION
          echo '# sửa tay' >> docker-compose.yml
          out=$(python3 scripts/reconcile.py)
          grep -q 'sửa tay' <<<"$out"
          if grep -q '^# sửa tay' docker-compose.yml; then exit 1; fi
          python3 scripts/smoke.py

      - name: Trạng thái và nhật ký dịch vụ khi lỗi
        if: failure()
        run: |
          $COMPOSE ps -a || true
          mkdir -p ci-logs
          for s in $($COMPOSE config --services); do
            $COMPOSE logs --no-color --tail=1000 "$s" > "ci-logs/$s.log" 2>&1 || true
          done
          tail -n 30 ci-logs/*.log

      - name: Lưu nhật ký và vết Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ github.run_attempt }}
          path: |
            ci-logs/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Quét bí mật và lỗ hổng phụ thuộc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Không lộ bí mật trong lịch sử commit (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --redact --no-banner -v /repo

      # Lỗ hổng chấp nhận tạm có lý do và hạn xem lại nằm trong osv-scanner.toml cạnh tệp khóa
      - name: Không dùng phụ thuộc có lỗ hổng đã biết (OSV-Scanner)
        run: docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER_IMAGE" scan source -r /src
