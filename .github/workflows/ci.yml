# Kiểm tra tự động trên mọi thay đổi: điều kiện chấm điểm PoF, test đơn vị, schema và quyền trên CSDL
# thật, dựng toàn bộ hệ thống rồi chạy seed → smoke → e2e, quét bí mật và lỗ hổng phụ thuộc.
# Action ngoài ghim theo SHA commit, image công cụ ghim theo digest — đổi phiên bản thì đổi cả hai.
# Máy chạy ghim ubuntu-24.04 (ubuntu-latest chuyển sang Ubuntu 26 cho ổn định môi trường CI); chỉ đổi sau khi đã chạy thử.
name: CI

# develop: mọi PR tính năng gộp vào đây; main: chỉ PR phát hành (docs/git_flow.md). Quy trình của PR (nhánh nguồn,
# tiêu đề) kiểm ở .github/workflows/pr.yml
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Có commit mới thì hủy lượt cũ của cùng nhánh hay PR, chỉ lượt mới nhất đáng chạy; main thì chạy đủ mọi commit vì mỗi
# commit trên main là một bản phát hành
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.19"
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
  # make sbom đọc biến này thay cho giá trị mặc định trong Makefile — hai chỗ phải trùng (test scripts kiểm)
  SYFT_IMAGE: ghcr.io/anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa

jobs:
  license:
    name: "Giấy phép (PoF #2)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Có bản sao toàn văn giấy phép
        run: |
          test -f LICENSE || { echo "::error::Thiếu tệp LICENSE (toàn văn giấy phép)"; exit 1; }
          grep -q "Apache License" LICENSE || { echo "::error::LICENSE không phải Apache-2.0"; exit 1; }
          test -f NOTICE || { echo "::error::Thiếu NOTICE (thông báo mục đích giấy phép)"; exit 1; }

      - name: Header giấy phép trong từng tệp mã
        run: ./scripts/license-header.sh check

      - name: Không bundle mã nguồn dự án khác
        run: |
          for d in vendor third_party node_modules; do
            if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
              echo "::error::Phát hiện thư mục bundle '$d' được commit — vi phạm tiêu chí PoF #5"
              exit 1
            fi
          done
          echo "Không có mã nguồn dự án khác bị bundle vào kho."

      # Header chỉ nói giấy phép của mã đội viết; gói kéo theo (gián tiếp, kể cả gói chỉ dùng lúc dựng) cũng không được
      # mang giấy phép xung đột (PoF #2 trừ điểm "xung đột giấy phép"). Syft liệt kê mọi gói trong tệp khóa npm,
      # requirements*.txt và action của workflow thành SBOM CycloneDX; giấy phép gói Python hỏi PyPI vì requirements.txt
      # không ghi
      - name: Danh mục thành phần SBOM CycloneDX (make sbom)
        run: make sbom

      # Chính sách lấy từ DEPENDENCIES.md (mục "Kiểm tra tương thích giấy phép"); gói ngoài chính sách hay chưa rõ giấy
      # phép chỉ qua khi có ngoại lệ ghi lý do trong .github/license-exceptions.json
      - name: Giấy phép mọi gói trong SBOM (make license-audit)
        run: make license-audit

  build:
    name: "Dựng từ mã nguồn (PoF #4)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cấu hình được trước khi dựng, không sửa tệp mã
        run: cp .env.example .env

      - name: Cú pháp Docker Compose hợp lệ
        run: docker compose config -q

      - name: Mọi profile đều phân giải được và có dịch vụ
        run: |
          for p in core app iot iot-sim ai ai-pull mail; do
            services=$(docker compose --profile "$p" config --services) \
              || { echo "::error::Profile '$p' không hợp lệ"; exit 1; }
            test -n "$services" || { echo "::error::Profile '$p' không có dịch vụ nào"; exit 1; }
            echo "profile $p: $(wc -w <<<"$services") dịch vụ"
          done

      # F3.14: profile logs (tắt mặc định) cùng tệp phủ đổi driver log của 8 dịch vụ sang fluentd phân giải được
      - name: Profile log tập trung phân giải được
        env:
          COMPOSE_FILE: docker-compose.yml:platform/logs/docker-compose.logs.yml
        run: docker compose --profile core --profile app --profile logs config -q

      # Bước che lần hai của Vector: cấu hình hợp lệ, mỗi luật che có ca trong platform/logs/vector.test.yaml (bỏ hay
      # nới một luật thì có ca đỏ). Image đúng dòng ghim digest trong docker-compose.yml
      - name: Log tập trung — cấu hình Vector và các luật che (vector validate, vector test)
        run: |
          image=$(sed -n '/^  vector:$/,/^    image:/s/^    image: //p' docker-compose.yml)
          m=(-v "$PWD/platform/logs:/etc/vector:ro"
             -v "$PWD/platform/logs/kiem-tra/mat-khau-gia.txt:/run/secrets/moc_logs_password:ro")
          docker run --rm --network none "${m[@]}" "$image" validate --deny-warnings /etc/vector/vector.yaml
          docker run --rm --network none "${m[@]}" "$image" test /etc/vector/vector.yaml /etc/vector/vector.test.yaml

      # F3.13 (#255): cấu hình Prometheus nạp được luật cảnh báo, mỗi luật có ca bật và ca không bật trong
      # platform/monitoring/kiem-tra/canh-bao.test.yml. promtool có sẵn trong image ghim digest ở docker-compose.yml
      - name: Giám sát — cấu hình Prometheus và luật cảnh báo (promtool check config, test rules)
        run: |
          image=$(sed -n '/^  prometheus:$/,/^    image:/s/^    image: //p' docker-compose.yml)
          m=(--entrypoint promtool -v "$PWD/platform/monitoring:/etc/prometheus:ro")
          docker run --rm --network none "${m[@]}" "$image" check config /etc/prometheus/prometheus.yml
          docker run --rm --network none "${m[@]}" "$image" test rules /etc/prometheus/kiem-tra/canh-bao.test.yml

      - name: Script khả thi và đúng cú pháp
        run: |
          for f in scripts/*.sh db/tests/stack.sh; do
            bash -n "$f" || { echo "::error::Lỗi cú pháp: $f"; exit 1; }
            test -x "$f" || { echo "::error::Thiếu quyền thực thi: $f"; exit 1; }
          done

      - name: Workflow GitHub Actions hợp lệ (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      # Bước có "if: matrix.phan == '…'" gọi sai tên phần (đổi tên, bỏ phần) thì bị bỏ qua âm thầm mà job vẫn xanh:
      # tên phần trong điều kiện nào cũng phải có trong ma trận, phần nào trong ma trận cũng phải có bước
      - name: Bước chạy thử khớp các phần trong ma trận
        run: |
          python3 - <<'PY'
          import re
          text = open(".github/workflows/ci.yml", encoding="utf-8").read()
          phases = [p.strip() for p in re.search(r"^ +phan: \[(.*)\]$", text, re.M).group(1).split(",")]
          used = [p for line in text.splitlines() if line.lstrip().startswith("if:")
                  for p in re.findall(r"matrix\.phan == '([^']*)'", line)]
          print(f"{len(phases)} phần: " + ", ".join(f"{p} ({used.count(p)} bước)" for p in phases))
          unknown = sorted(set(used) - set(phases))
          empty = [p for p in phases if p not in used]
          assert not unknown, f"bước gọi phần không có trong ma trận: {unknown}"
          assert not empty, f"phần không có bước nào: {empty}"
          PY

  docs:
    name: "Tài liệu (PoF #6)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Có đủ tài liệu bắt buộc
        run: |
          for f in README.md CHANGELOG.md CONTRIBUTING.md DEPENDENCIES.md; do
            test -f "$f" || { echo "::error::Thiếu $f"; exit 1; }
          done
          echo "Đủ tài liệu bắt buộc."

      - name: CHANGELOG có mục cho thay đổi chưa phát hành
        run: |
          grep -q "## \[Chưa phát hành\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md thiếu mục [Chưa phát hành]"; exit 1; }

  unit:
    name: Test đơn vị dịch vụ và kiểm form
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python khớp image của dịch vụ (python:3.13-slim); thư viện cài theo băm trong requirements-dev.txt
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"
          cache-suffix: unit

      # Node khớp image dựng giao diện (node:24-slim); Ajv biên dịch schemas/ thành mã kiểm form
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: apps/office/package-lock.json

      - name: Thư viện giao diện theo package-lock.json
        working-directory: apps/office
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: svc-files, svc-workflow, kiểm form theo schemas/ (make test)
        run: make test

  db:
    name: Schema và quyền trên CSDL thật
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"
          cache-suffix: db

      - name: Dựng PostgreSQL + Hasura, nạp migrations và metadata từ db/
        run: db/tests/stack.sh up

      - name: Schema, quyền theo đơn vị, vào sổ đến, chuỗi băm kiểm toán
        working-directory: db/tests
        env:
          MOC_IT: "1"
        run: uv run --no-project --with-requirements requirements.txt python -m pytest -q

      - name: Nhật ký Hasura khi lỗi
        if: failure()
        run: docker logs --tail 200 moc-db-it-hasura || true

  # PR chỉ đổi tài liệu (*.md, ảnh trong docs/; trừ docs/api/ do máy sinh, CI so với hệ thống thật) thì không dựng
  # cả hệ thống; PR không đổi tệp nào (commit gộp chỉ ghi lịch sử, PR gộp ngược sau phát hành) cũng vậy. Push lên
  # develop, main luôn chạy đủ
  thay-doi:
    name: Phạm vi thay đổi
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ma: ${{ steps.loc.outputs.ma }}
    steps:
      - name: Có tệp nào ngoài tài liệu không
        id: loc
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SO_TEP: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "ma=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # gh api lỗi thì bước dừng ở đây (bash -e). Danh sách rỗng chỉ hợp lệ khi chính sự kiện báo 0 tệp
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            test "$SO_TEP" = 0 || { echo "::error::Không đọc được danh sách tệp của PR"; exit 1; }
            echo "ma=false" >> "$GITHUB_OUTPUT"; echo "PR không đổi tệp nào, không dựng hệ thống"; exit 0
          fi
          ma=$(grep -vE '\.md$|^docs/.*\.(png|jpe?g|svg|gif|webp)$' <<<"$files"; grep -E '^docs/api/' <<<"$files") || true
          if [ -n "$ma" ]; then
            echo "ma=true" >> "$GITHUB_OUTPUT"
            echo "Có đổi ngoài tài liệu, chạy thử toàn hệ thống. Ví dụ:"; head -20 <<<"$ma"
          else
            echo "ma=false" >> "$GITHUB_OUTPUT"
            echo "PR chỉ đổi tài liệu, không dựng hệ thống:"; cat <<<"$files"
          fi

  # Sáu phần chạy song song trên sáu máy. Phần nào cũng tự dựng và nạp mẫu (≈ 3 phút) rồi chạy nhóm bước của mình theo
  # đúng thứ tự cũ: luồng chính, các màn lõi | e2e | màn AI và số đo | nộp lưu, phả hệ, ký số, sao lưu và khôi phục |
  # cài đặt, GitOps | HTTPS sau proxy TLS (cấu hình từ trước make up, nên là phần riêng). Bước cần trạng thái do bước
  # trước để lại thì ở cùng phần: phả hệ sau nộp lưu, đo "sau" sau màn giao việc, nộp lưu và ký số trước sao lưu để bản
  # khôi phục có cả hồ sơ lạnh, CA và khóa ký. Job build kiểm tên phần trong điều kiện từng bước khớp ma trận
  chay-thu:
    name: "Chạy thử: ${{ matrix.phan }}"
    needs: [build, thay-doi]
    if: needs.thay-doi.outputs.ma == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phan: [luong-chinh, e2e, ai, sao-luu, cai-dat, https]
    env:
      # gồm cả profile iot: khi lỗi, nhật ký có cả broker NGSI-LD (màn IT/OT tự bật profile này)
      COMPOSE: docker compose --profile core --profile app --profile iot
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Thời hạn mỗi bước rút còn 20 giây để make smoke chờ được timer nhắc hạn và báo lãnh đạo (≈ 1 phút). Chỉ smoke
      # của luong-chinh kiểm nhắc hạn; smoke chạy lại ở phần khác đặt PT24H trên lệnh để khỏi chờ timer lần nữa
      MOC_SLA_DURATION: PT20S
      # Python in ngay từng dòng: mốc thời gian trong nhật ký smoke, demo là lúc chạy thật, không phải lúc xả bộ đệm
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bước GitOps đẩy HEAD sang một repo git mới: bản sao nông (mặc định) bị từ chối "shallow update not allowed"
          fetch-depth: 0

      # Không bắt buộc: chỉ cần khi Docker Hub giới hạn lượt tải ẩn danh. Đặt biến DOCKERHUB_USERNAME và
      # secret DOCKERHUB_TOKEN (token chỉ đọc) trong Settings → Secrets and variables → Actions.
      - name: Đăng nhập Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Đi đúng các bước README hướng dẫn người dùng mới
      - name: Sinh cấu hình (make env)
        run: make env

      # F1.9 (#261): phần https dựng đường HTTPS sau proxy của docs/trien-khai.md — bước 3 sửa .env trước khi chạy,
      # proxy TLS như Caddyfile ở bước 5 (nginx-unprivileged ghim trong apps/office/Dockerfile thay Caddy, chứng thư do
      # một CA tự ký cấp cho signet.test), rồi make up, make seed và mọi bước sau đi qua proxy. Đây không phải đường
      # của bản online (Cloudflare Tunnel)
      - name: HTTPS sau proxy TLS — .env như docs/trien-khai.md bước 3, proxy như bước 5
        if: matrix.phan == 'https'
        run: |
          sed -i -e 's#^MOC_PUBLIC_URL=.*#MOC_PUBLIC_URL=https://signet.test#' \
                 -e 's#^MOC_HTTP_PORT=.*#MOC_HTTP_PORT=127.0.0.1:8080#' \
                 -e 's#^MOC_TRUSTED_PROXY=.*#MOC_TRUSTED_PROXY=172.16.0.0/12#' .env
          want='MOC_(PUBLIC_URL=https://signet.test|HTTP_PORT=127.0.0.1:8080|TRUSTED_PROXY=172.16.0.0/12)'
          test "$(grep -cxE "$want" .env)" = 3
          echo "127.0.0.1 signet.test" | sudo tee -a /etc/hosts
          d="$RUNNER_TEMP/https" && mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=Signet CI CA" -keyout "$d/ca.key" \
            -out "$d/ca.pem" -addext basicConstraints=critical,CA:true -addext keyUsage=critical,keyCertSign,cRLSign
          openssl req -newkey rsa:2048 -nodes -subj "/CN=signet.test" -keyout "$d/site.key" -out "$d/site.csr"
          printf '%s\n' subjectAltName=DNS:signet.test extendedKeyUsage=serverAuth basicConstraints=CA:false \
            > "$d/site.ext"
          openssl x509 -req -in "$d/site.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 30 \
            -extfile "$d/site.ext" -out "$d/site.pem"
          chmod 644 "$d/site.key"   # nginx đọc bằng uid 101; khóa chỉ sống trong lượt CI này
          # seed, smoke, kiem_ban_online.py (Python) tin CA này qua SSL_CERT_FILE; giữ cả kho CA của máy cho bước khác
          cat /etc/ssl/certs/ca-certificates.crt "$d/ca.pem" > "$d/ca-bundle.pem"
          echo "SSL_CERT_FILE=$d/ca-bundle.pem" >> "$GITHUB_ENV"
          # Như Caddyfile bước 5: X-Forwarded-For/-Proto/-Host, X-Forwarded-Port 443, WebSocket (thông báo realtime),
          # cổng 80 chuyển sang 443, không giới hạn cỡ yêu cầu (APISIX chặn trên 64 MB)
          cat > "$d/proxy.conf" <<'NGINX'
          map $http_upgrade $connection_upgrade { default upgrade; '' close; }
          server {
              listen 80;
              server_name signet.test;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              server_name signet.test;
              ssl_certificate /tls/site.pem;
              ssl_certificate_key /tls/site.key;
              client_max_body_size 0;
              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Port 443;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_read_timeout 120s;
              }
          }
          NGINX
          img=$(sed -n 's#^FROM \(nginxinc/nginx-unprivileged:[^ ]*\).*#\1#p' apps/office/Dockerfile)
          # Docker Hub đôi khi trả 502: thử 3 lần, lần thứ ba vẫn lỗi thì dừng bước tại đây
          for i in 1 2 3; do docker pull -q "$img" && break; test "$i" -lt 3; sleep 15; done
          # nginx-unprivileged chạy uid 101; --network host dùng chung mạng của runner để tới 127.0.0.1:8080 như Caddy
          # trên máy chủ, nên phải cho tiến trình thường mở cổng 80, 443 của runner
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          docker run -d --name moc-https-proxy --network host -v "$d/proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$d/site.pem:/tls/site.pem:ro" -v "$d/site.key:/tls/site.key:ro" "$img"
          sleep 2
          running=$(docker inspect -f '{{.State.Running}}' moc-https-proxy)
          [ "$running" = true ] || { docker logs moc-https-proxy; exit 1; }

      - name: Dựng image và khởi động lõi + ứng dụng (make up)
        run: make up

      # Volume chữ ký của CI luôn mới tạo: freshclam tải bản daily mới đúng lúc clamd đang nạp bản có sẵn trong image,
      # nên 600 giây sau (SelfCheck) clamd tự nạp lại, và suốt lúc nạp không quét gì (ConcurrentDatabaseReload no). Tải
      # lên của smoke, e2e rơi vào lúc đó thì treo (#287). Bắt clamd nạp ngay bây giờ, trước mọi bước tải lên; cấu hình
      # chạy thật giữ nguyên
      - name: ClamAV dùng bản chữ ký freshclam vừa tải
        run: |
          daily() {   # "ClamAV 1.5.4/28165/…": clamdscan hỏi clamd đang dùng bản nào, clamscan đọc tệp trên đĩa
            $COMPOSE exec -T clamav timeout 90 "$1" --version 2>/dev/null | sed -n 's#^ClamAV [^/]*/\([0-9]*\)/.*#\1#p'
          }
          # $SECONDS đếm từ đầu bước: không bắt đầu vòng mới sau 4 phút. Vòng đang dở có thể kéo thêm, vì mỗi lần hỏi
          # chờ tối đa 90 giây (clamd đang nạp thì trả lời khi nạp xong); câu cảnh báo in số giây thật
          while [ "$SECONDS" -lt 240 ]; do
            # chỉ so khi freshclam đã xong lượt đầu (tải bản mới, báo đã mới nhất, hay lỗi): sớm hơn thì có thể so trước
            # khi nó ghi tệp
            if $COMPOSE logs clamav | grep -qE 'daily\.c[lv]d (updated|database is up-to-date)|update process failed'
            then
              disk=$(daily clamscan) loaded=$(daily clamdscan)
              echo "daily trên đĩa: ${disk:-?}, clamd đang dùng: ${loaded:-?}"
              if [ -n "$disk" ] && [ "$disk" = "$loaded" ]; then exit 0; fi
              # clamd chưa trả lời thì chưa gửi RELOAD; đang nạp thì clamdscan --version chờ tới khi nạp xong
              if [ -n "$loaded" ] && [ -z "${sent:-}" ]; then
                $COMPOSE exec -T clamav timeout 60 clamdscan --reload || true
                sent=1
              fi
            fi
            sleep 5
          done
          echo "::warning::clamd chưa dùng bản daily trên đĩa sau $SECONDS giây: tải lên có thể treo lúc clamd nạp lại"

      # Phần e2e quét trợ năng cả Bảng tin (#250, tests/e2e/tro-nang.spec.ts), là ứng dụng cắm bằng manifest. Cài trước
      # make seed: tin của Bảng tin chỉ sinh từ sự kiện mới (Event Trigger không đọc lại dòng cũ), nên văn bản mẫu vào
