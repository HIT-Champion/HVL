name: Báo lỗi
description: Báo cáo một lỗi của DX-Lab
title: "[Lỗi]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã dành thời gian báo lỗi. Thông tin càng cụ thể, lỗi càng nhanh được sửa.

  - type: dropdown
    id: space
    attributes:
      label: Không gian liên quan
      description: Lỗi thuộc trục nào của kiến trúc H-P-D-I?
      options:
        - "[H] Nhân sự — SSO, lưu trữ, wiki, truyền thông"
        - "[P] Quy trình — biểu mẫu, luồng việc, tích hợp API"
        - "[D] Dữ liệu — CSDL, đồng bộ, dashboard"
        - "[I] Trí tuệ nhân tạo — RAG, tác tử tự hành"
        - "Hạ tầng — cài đặt, Docker, cấu hình"
        - "Tài liệu"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Chạy `make up`
        2. Mở http://localhost/...
        3. Nhấn vào ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phiên bản DX-Lab
      description: "Kết quả của lệnh: git describe --tags --always"
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      placeholder: |
        - Hệ điều hành: Ubuntu 24.04
        - Docker: 27.0.3
        - RAM: 16 GB

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký liên quan
      description: "Kết quả của lệnh: make logs"
      render: shell
