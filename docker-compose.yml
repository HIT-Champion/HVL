# ---------------------------------------------------------------------------
# Mộc — điều phối 4 không gian H-P-D-I.
#
# NGUYÊN TẮC: tệp này chỉ ĐIỀU PHỐI các phần mềm nguồn mở thượng nguồn ở dạng
# NGUYÊN BẢN qua image chính thức có ghim thẻ phiên bản. Kho mã nguồn Mộc
# không chứa bản sao và không chỉnh sửa mã nguồn của chúng (tiêu chí PoF #5).
#
# Mỗi không gian là một profile riêng, cho phép triển khai theo đúng lộ trình
# tuyến tính [H] -> [P] -> [D] -> [I]:
#
#   docker compose --profile h up -d               # chỉ trục [H]
#   docker compose --profile h --profile p up -d   # [H] + [P]
#   docker compose --profile all up -d             # đủ 4 trục
# ---------------------------------------------------------------------------

name: moc

x-common: &common
  restart: unless-stopped
  networks: [moc]
  environment:
    TZ: ${MOC_TIMEZONE:-Asia/Ho_Chi_Minh}

services:

  # =========================================================================
  # [D] KHÔNG GIAN DỮ LIỆU — nền tảng lưu trữ dùng chung
  # Khai báo sớm vì các trục [H] và [P] đều phụ thuộc vào CSDL này.
  # =========================================================================
  postgres:
    <<: *common
    image: postgres:16-alpine
    profiles: [h, p, d, i, all]
    environment:
      TZ: ${MOC_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB:-moc}
      POSTGRES_USER: ${POSTGRES_USER:-moc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bat buoc dat POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moc} -d ${POSTGRES_DB:-moc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # [H] KHÔNG GIAN NHÂN SỰ — môi trường làm việc số khép kín
  # Các dịch vụ dưới đây được chốt sau giai đoạn khảo sát công cụ.
  # Xem docs/architecture.md, mục "Bản đồ công cụ".
  # =========================================================================
  # h-sso:        # Quản trị định danh tập trung (SSO)
  # h-storage:    # Lưu trữ đám mây nội bộ, cấu trúc P.A.R.A
  # h-wiki:       # Hệ quản trị tri thức
  # h-chat:       # Truyền thông nội bộ tức thời

  # =========================================================================
  # [P] KHÔNG GIAN QUY TRÌNH — tự động hóa luồng việc hướng sự kiện
  # =========================================================================
  # p-lowcode:    # Nền tảng low-code dựng biểu mẫu và giao diện
  # p-workflow:   # Tự động hóa luồng việc / iPaaS

  # =========================================================================
  # [D] KHÔNG GIAN DỮ LIỆU — trực quan hóa và nguồn sự thật duy nhất
  # =========================================================================
  # d-bi:         # Nền tảng BI, dashboard thời gian thực

  # =========================================================================
  # [I] KHÔNG GIAN TRÍ TUỆ NHÂN TẠO — chỉ bật khi [D] đã có nguồn sự thật
  # =========================================================================
  # i-vectordb:   # Cơ sở dữ liệu véc-tơ
  # i-agent:      # Tác tử tự hành (Agentic AI)

networks:
  moc:
    driver: bridge

volumes:
  postgres_data:
