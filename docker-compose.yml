# ---------------------------------------------------------------------------
# Mộc — điều phối hai tầng của DX-OS Open-Core (docs/architecture.md).
#
# NGUYÊN TẮC: tệp này chỉ ĐIỀU PHỐI phần mềm nguồn mở thượng nguồn ở dạng
# NGUYÊN BẢN qua image chính thức có ghim phiên bản; mã của đội (svc-*, app-*)
# dựng từ thư mục trong repo. Không chép, không sửa mã của dự án khác (PoF #5).
#
#   profile core — Tầng 1, lõi headless: chỉ APISIX mở cổng ra ngoài
#   profile app  — Tầng 2, ứng dụng Văn phòng điện tử
#
#   make up        # = docker compose --profile core --profile app up -d
# ---------------------------------------------------------------------------

name: moc

x-common: &common
  restart: unless-stopped
  networks: [moc]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# Địa chỉ realm: iss trong token là URL công khai; khóa công khai lấy qua mạng nội bộ
x-oidc: &oidc
  MOC_OIDC_ISSUER: ${MOC_PUBLIC_URL:?}/realms/${MOC_REALM:-moc}
  MOC_OIDC_JWKS_URL: http://keycloak:8080/realms/${MOC_REALM:-moc}/protocol/openid-connect/certs

services:

  # ===========================================================================
  # Tầng 1 — lõi headless
  # ===========================================================================

  postgres:
    <<: *common
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    profiles: [core]
    environment:
      TZ: ${MOC_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB:-moc}
      POSTGRES_USER: ${POSTGRES_USER:-moc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # hỏi qua TCP: lúc khởi tạo, image chạy một máy chủ tạm chỉ nghe socket Unix
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-moc} -d ${POSTGRES_DB:-moc}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # F1.1 — SSO. Realm nạp từ auth/realm/ ở lần đầu (bỏ qua nếu realm đã có).
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    profiles: [core]
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # URL công khai qua APISIX; dịch vụ nội bộ gọi thẳng http://keycloak:8080
      KC_HOSTNAME: ${MOC_PUBLIC_URL:?}
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50
      # giá trị thay vào auth/realm/moc-realm.json khi nạp
      MOC_PUBLIC_URL: ${MOC_PUBLIC_URL:?}
      MOC_CLI_CLIENT_ENABLED: ${MOC_CLI_CLIENT_ENABLED:-false}
      MOC_DIRECTORY_CLIENT_SECRET: ${MOC_DIRECTORY_CLIENT_SECRET:?}
    volumes:
      - ./auth/realm:/opt/keycloak/data/import:ro
    ports:
      # trang quản trị: chỉ trên máy chủ, không qua APISIX
      - 127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}:8080
    mem_limit: 1g
    healthcheck:
      # Sẵn sàng khi chính realm trả được JWKS. /health/ready báo UP sớm hơn, lúc Keycloak còn khởi tạo và trả
      # 503 "Bootstrap in progress": Hasura lấy JWKS đúng lúc đó sẽ dừng rồi khởi động lại, make up báo lỗi.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/${MOC_REALM:-moc}/protocol/openid-connect/certs HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.. 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}

  # F1.2 — cổng duy nhất mở ra ngoài
  apisix:
    <<: *common
    image: apache/apisix:3.18.0-debian@sha256:84e6b5e787e9f889ebff88161cb9a16599bafcffa236c6b54c7f779a0655940d
    profiles: [core]
    environment:
      MOC_REALM: ${MOC_REALM:-moc}
      MOC_FILES_MAX_MB: ${MOC_FILES_MAX_MB:-25}
      MOC_RATE_LOGIN_PER_MIN: ${MOC_RATE_LOGIN_PER_MIN:-60}
      MOC_RATE_API_PER_MIN: ${MOC_RATE_API_PER_MIN:-300}
      MOC_RATE_VERIFY_PER_MIN: ${MOC_RATE_VERIFY_PER_MIN:-30}
      MOC_RATE_REALTIME_PER_MIN: ${MOC_RATE_REALTIME_PER_MIN:-60}
      MOC_TRUSTED_PROXY: ${MOC_TRUSTED_PROXY:-127.0.0.1/32}
    volumes:
      - ./gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - ${MOC_HTTP_PORT:-8080}:9080
    depends_on:
      keycloak: {condition: service_healthy}

  # F1.3 — GraphQL tự sinh, quyền theo vai trò và thuê ước; migrations + metadata tự áp từ db/
  hasura:
    <<: *common
    image: hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3@sha256:c799b59f3b9f60609cfd1c0a0405dfcf56a5009a414298c28409af50c05e0919
    profiles: [core]
    volumes:
      - ./db/migrations:/hasura-migrations:ro
      - ./db/metadata:/hasura-metadata:ro
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-moc}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-moc}
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${POSTGRES_USER:-moc}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-moc}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?}
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"http://keycloak:8080/realms/${MOC_REALM:-moc}/protocol/openid-connect/certs","issuer":"${MOC_PUBLIC_URL}/realms/${MOC_REALM:-moc}","claims_namespace":"https://hasura.io/jwt/claims"}'
      HASURA_GRAPHQL_ENABLED_APIS: graphql,metadata
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS: "false"
      # KHÔNG đặt HASURA_GRAPHQL_UNAUTHORIZED_ROLE: không có vai trò ẩn danh
      MOC_WORKFLOW_URL: http://svc-workflow:8000
      MOC_ACTION_SECRET: ${MOC_ACTION_SECRET:?}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  # F1.4 — động cơ quy trình BPMN; chỉ svc-workflow gọi, không qua APISIX
  flowable:
    <<: *common
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    profiles: [core]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:?}
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "10"
      FLOWABLE_REST_APP_ADMIN_USER_ID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      FLOWABLE_REST_APP_SWAGGER_DOCS_ENABLED: "false"
      # biến quy trình chỉ nhận kiểu đơn giản: không giải tuần tự hóa đối tượng Java gửi qua REST
      REST_VARIABLES_ALLOW_SERIALIZABLE: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      JAVA_OPTS: -Xmx512M
      TZ: ${MOC_TIMEZONE:-Asia/Ho_Chi_Minh}
    mem_limit: 1g
    healthcheck:
      # actuator của Flowable đòi đăng nhập
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://rest-admin:$${FLOWABLE_REST_APP_ADMIN_PASSWORD}@127.0.0.1:8080/flowable-rest/actuator/health\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}

  # F1.5 — kho đối tượng. Chỉ svc-files gọi; không có URL ký sẵn nào phát ra ngoài.
  # Nằm riêng mạng storage với svc-files: filer (8888) và volume server của SeaweedFS không kiểm khóa và đi vòng
  # được qua khóa ghi (S3 Object Lock) của bucket lạnh — container khác, kể cả PostgreSQL, không được tới đó (F2.12).
  seaweedfs:
    <<: *common
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    profiles: [core]
    networks: [storage]
    # Không có tệp danh tính thì cổng S3 không kiểm khóa: sinh tệp từ .env trước khi chạy
    # (khóa chỉ gồm chữ và số)
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '{"identities":[{"name":"svc-files","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$SEAWEEDFS_S3_ACCESS_KEY" "$$SEAWEEDFS_S3_SECRET_KEY" > /tmp/s3.json
        chown seaweed:seaweed /tmp/s3.json
        exec /entrypoint.sh "$$@"
      - --
    # -filer.disableHttp: chỉ đi qua cổng S3 (có kiểm khóa, có Object Lock); -master.telemetry=false: không gửi
    # thống kê ra ngoài
    command: >-
      server -s3 -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024
      -s3.config=/tmp/s3.json -filer.disableHttp -master.telemetry=false
    environment:
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?}
    volumes:
      - seaweedfs_data:/data

  # F1.6 — trạm kiểm dịch. Giữ volume chữ ký để không tải lại mỗi lần khởi động.
  clamav:
    <<: *common
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    profiles: [core]
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_StreamMaxLength: 64M
      CLAMD_CONF_TemporaryDirectory: /tmp
      # tệp có mật khẩu (zip, 7z, rar, pdf phải nhập mật khẩu mới mở) và tệp giải nén vượt giới hạn quét (bom nén,
      # lồng quá sâu) báo FOUND với mẫu Heuristics.Encrypted.* / Heuristics.Limits.Exceeded.* thay vì OK: không quét
      # được bên trong thì không nhận (svc-files trả 422 unscannable)
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_AlertExceedsMax: "yes"
    # F3.7 — clamd ghi luồng nhận qua INSTREAM (và phần giải nén của PDF) ra thư mục tạm trước khi quét: để trong RAM,
    # bản rõ của văn bản hạn chế không xuống đĩa ở cả container quét
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - clamav_data:/var/lib/clamav

  # F1.7 — tìm kiếm toàn văn; chỉ svc-files gọi
  meilisearch:
    <<: *common
    image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
    profiles: [core]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data

  # F3.2 — két bí mật (openbao/start.sh): svc-files, svc-workflow lấy bí mật qua AppRole lúc khởi động thay vì nhận
  # qua biến môi trường; khóa transit moc-files cho F3.7; F4.5 — PKI nội bộ (CA moc-root, chỉ minh họa) cấp chứng thư
  # cho khóa ký transit moc-ky-so-<đơn vị>. Static seal: khởi động lại là tự mở khóa. Không mở cổng ra ngoài. Chạy
  # bằng root chỉ để ghi tệp đăng nhập cho từng dịch vụ; máy chủ chạy bằng người dùng openbao.
  openbao:
    <<: *common
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    profiles: [core]
    # chỉ mạng secrets: container khác (APISIX, Hasura…) không tới được két, kể cả lúc két chưa khởi tạo
    networks: [secrets]
    user: "0"
    entrypoint: ["sh", "/moc/start.sh"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      MOC_OPENBAO_SEAL_KEY: ${MOC_OPENBAO_SEAL_KEY:?}
      # nạp vào két mỗi lần khởi động; chỉ container này nhận các biến này
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?}
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      MOC_ACTION_SECRET: ${MOC_ACTION_SECRET:?}
      FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?}
      MOC_DIRECTORY_CLIENT_SECRET: ${MOC_DIRECTORY_CLIENT_SECRET:?}
    volumes:
      - ./openbao:/moc:ro
      - openbao_data:/openbao/file
      - openbao_svc_files:/run/moc/svc-files
      - openbao_svc_workflow:/run/moc/svc-workflow
    # sẵn sàng = đã mở khóa VÀ đã nạp bí mật, cấp AppRole xong
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/moc-ready && bao status >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  svc-files:
    <<: *common
    build: ./services/svc-files
    image: moc/svc-files:${MOC_VERSION:-dev}
    profiles: [core]
    # ai: tới Ollama (profile ai, F4.1, F4.2) — chưa bật profile thì svc-files dò thấy không có, trích yếu theo quy tắc,
    # trợ lý hỏi đáp chỉ tìm theo từ khóa và trả câu trích nguyên văn
    networks: [moc, storage, secrets, ai]
    environment:
      <<: *oidc
      # F3.2 — khóa S3, khóa quản trị Hasura, khóa Meilisearch lấy từ két lúc khởi động (AppRole), không ở đây
      MOC_OPENBAO_ADDR: http://openbao:8200
      MOC_OPENBAO_SECRET_PATH: moc/data/svc-files
      MOC_FILES_MAX_MB: ${MOC_FILES_MAX_MB:-25}
      # F3.7 — PDF của văn bản hạn chế nhiều trang hơn thì không nhận (415), không đóng dấu (422)
      MOC_RESTRICTED_MAX_PAGES: ${MOC_RESTRICTED_MAX_PAGES:-500}
      # in vào mã QR của văn bản đi phát hành: <MOC_PUBLIC_URL>/xac-thuc/<mã>
      MOC_PUBLIC_URL: ${MOC_PUBLIC_URL:?}
      # F2.12 — neo đầu chuỗi sổ kiểm toán ra bucket lạnh có khóa ghi
      MOC_AUDIT_ANCHOR_INTERVAL_S: ${MOC_AUDIT_ANCHOR_INTERVAL_S:-600}
      MOC_AUDIT_ANCHOR_RETENTION_DAYS: ${MOC_AUDIT_ANCHOR_RETENTION_DAYS:-3650}
      # F3.8 — nộp lưu hồ sơ đã đóng sang bucket lạnh
      MOC_ARCHIVE_INTERVAL_S: ${MOC_ARCHIVE_INTERVAL_S:-3600}
      MOC_ARCHIVE_AFTER_DAYS: ${MOC_ARCHIVE_AFTER_DAYS:-365}
      MOC_OPENLINEAGE_URL: ${MOC_OPENLINEAGE_URL:-}
      # F4.1 — đọc văn bản đến: lớp chữ PDF hoặc OCR (Tesseract trong image), quy tắc gợi ý các trường của form tiếp
      # nhận; mô hình ngôn ngữ (Ollama, profile ai) chỉ viết trích yếu. MOC_AI_URL đặt rỗng thì không dò mô hình
      MOC_READ_ENABLED: ${MOC_READ_ENABLED:-true}
      MOC_READ_CONCURRENCY: ${MOC_READ_CONCURRENCY:-1}
      MOC_OCR_TIMEOUT_S: ${MOC_OCR_TIMEOUT_S:-40}
      MOC_AI_URL: ${MOC_AI_URL-http://ollama:11434}
      MOC_AI_MODEL: ${MOC_AI_MODEL:-qwen3:1.7b}
      MOC_AI_TIMEOUT_S: ${MOC_AI_TIMEOUT_S:-20}
      MOC_AI_SUMMARY: ${MOC_AI_SUMMARY:-fallback}
      # F4.2 — trợ lý hỏi đáp trên kho văn bản: chỉ mục đoạn `chunks` trong Meilisearch (chỉ văn bản người hỏi được
      # xem, không bao giờ có văn bản hạn chế), câu trích nguyên văn kèm số ký hiệu và trang; có Ollama thì thêm tìm
      # theo nghĩa (mô hình nhúng) và câu trả lời có trích dẫn. MOC_AI_EMBED_MODEL đặt rỗng thì chỉ tìm theo từ khóa;
      # MOC_ASK_MODEL rỗng thì dùng MOC_AI_MODEL
      MOC_ASK_ENABLED: ${MOC_ASK_ENABLED:-true}
      MOC_AI_EMBED_MODEL: ${MOC_AI_EMBED_MODEL-qwen3-embedding:0.6b}
      MOC_ASK_MODEL: ${MOC_ASK_MODEL:-}
      MOC_ASK_DEADLINE_S: ${MOC_ASK_DEADLINE_S:-50}
      MOC_ASK_MODEL_TIMEOUT_S: ${MOC_ASK_MODEL_TIMEOUT_S:-40}
      # F4.5 — ký số PAdES bản phát hành văn bản đi bằng khóa Transit của đơn vị, chứng thư do CA nội bộ trong két
      # cấp (chỉ minh họa, không có giá trị pháp lý). false: phát hành không ký, không gọi Transit hay PKI. Két khởi
      # tạo trước F4.5 chưa có PKI thì svc-files tự tắt ký số (README mục Két bí mật)
      MOC_SIGN_ENABLED: ${MOC_SIGN_ENABLED:-true}
    volumes:
      - openbao_svc_files:/run/openbao:ro
    # F3.7 — tệp tải lên quá 1 MB được đệm ra /tmp trước khi quét, mã hóa: để trong RAM, bản rõ của văn bản hạn chế
    # không xuống đĩa. Đủ cho vài lượt tải song song cỡ MOC_FILES_MAX_MB.
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      # restart: két được dựng lại (vd đổi bí mật trong .env) thì dịch vụ khởi động lại, lấy bí mật mới
      openbao: {condition: service_healthy, restart: true}
      hasura: {condition: service_healthy}
      seaweedfs: {condition: service_started}
      clamav: {condition: service_started}
      meilisearch: {condition: service_started}

  svc-workflow:
    <<: *common
    # schemas/ (JSON Schema dùng chung với giao diện) dựng vào image như ở app-office: hai lớp kiểm luôn cùng một bản
    build: {context: ./services/svc-workflow, additional_contexts: {schemas: ./schemas}}
    image: moc/svc-workflow:${MOC_VERSION:-dev}
    profiles: [core]
    networks: [moc, secrets, iot]
    environment:
      # F3.2 — khóa Hasura, khóa Actions, mật khẩu Flowable, khóa Centrifugo, client secret lấy từ két (AppRole)
      MOC_OPENBAO_ADDR: http://openbao:8200
      MOC_OPENBAO_SECRET_PATH: moc/data/svc-workflow
      MOC_SLA_DURATION: ${MOC_SLA_DURATION:-PT24H}
      # F3.10 — context broker NGSI-LD (profile iot); chưa bật profile thì chỉ ghi nhật ký một lần
      MOC_NGSI_URL: http://scorpio:9090
      MOC_OT_THRESHOLD: ${MOC_OT_THRESHOLD:-35}
      # F4.3 — tác tử gợi ý giao việc moc-assigner: nhánh BPMN song song từ lúc vào sổ (topic moc-goi-y), tìm văn bản
      # đến tương tự đã giao qua route nội bộ của svc-files, bỏ phiếu đơn vị chủ trì. Không cần mô hình; svc-files
      # không trả lời thì văn bản vẫn tới lãnh đạo, chỉ không có gợi ý (không phụ thuộc svc-files ở depends_on)
      MOC_SUGGEST_ENABLED: ${MOC_SUGGEST_ENABLED:-true}
      MOC_SUGGEST_POLL_INTERVAL_S: ${MOC_SUGGEST_POLL_INTERVAL_S:-2}
      MOC_SUGGEST_TIMEOUT_S: ${MOC_SUGGEST_TIMEOUT_S:-10}
      MOC_SUGGEST_MIN_SCORE: ${MOC_SUGGEST_MIN_SCORE:-0.3}
      MOC_ASSIGNER_ID: ${MOC_ASSIGNER_ID:-moc-assigner}
      MOC_KEYCLOAK_URL: http://keycloak:8080
      MOC_REALM: ${MOC_REALM:-moc}
      TZ: ${MOC_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ./processes:/app/processes:ro
      - openbao_svc_workflow:/run/openbao:ro
    depends_on:
      # restart: két được dựng lại (vd đổi bí mật trong .env) thì dịch vụ khởi động lại, lấy bí mật mới
      openbao: {condition: service_healthy, restart: true}
      hasura: {condition: service_healthy}
      flowable: {condition: service_healthy}
    # Không phụ thuộc centrifugo: thiếu nó thì thông báo vẫn lưu, chỉ không đẩy tức thời

  # F2.5 — đẩy thông báo tới trình duyệt qua WebSocket (/realtime ở APISIX); tự kiểm token Keycloak
  centrifugo:
    <<: *common
    image: centrifugo/centrifugo:v6.9.7@sha256:d014d3e99e0e9e58c45e656a7ea4ab97c3f79f96c82a3614ea0f810b4dd0e461
    profiles: [core]
    command: ["centrifugo", "--config", "/centrifugo/config.yaml"]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?}
      # iss trong token là URL công khai; khóa công khai lấy qua mạng nội bộ
      CENTRIFUGO_CLIENT_TOKEN_JWKS_PUBLIC_ENDPOINT: http://keycloak:8080/realms/${MOC_REALM:-moc}/protocol/openid-connect/certs
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: ${MOC_PUBLIC_URL:?}/realms/${MOC_REALM:-moc}
      # chỉ trang của chính Mộc được mở WebSocket (chặn trang lạ dùng phiên của người dùng)
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${MOC_PUBLIC_URL:?}
    volumes:
      - ./realtime:/centrifugo:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      keycloak: {condition: service_healthy}

  # F3.13 — giám sát gọn: Prometheus thu chỉ số của cổng API (plugin prometheus của APISIX, cổng 9091 nội bộ),
  # Grafana hiện bảng điều khiển nạp sẵn. Prometheus không mở cổng; Grafana chỉ nghe 127.0.0.1 trên máy chủ, không có
  # tài khoản quản trị, chỉ xem ẩn danh (bảng điều khiển sửa trong repo, không sửa trên giao diện).
  prometheus:
    <<: *common
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [core]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${MOC_METRICS_RETENTION:-15d}
    mem_limit: 512m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      apisix: {condition: service_started}

  # Grafana (AGPL-3.0) chạy như một dịch vụ độc lập, nguyên bản; Mộc chỉ nạp cấu hình qua tệp
  grafana:
    <<: *common
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: [core]
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cong-api.json
    mem_limit: 512m
    # không giữ trạng thái: không tài khoản, bảng điều khiển nạp từ tệp — dựng lại container là như cũ
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - 127.0.0.1:${MOC_GRAFANA_PORT:-3300}:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    depends_on:
      prometheus: {condition: service_healthy}

  # F3.10 — hội tụ IT/OT (màn ii), profile iot (tùy chọn: `make demo-it-ot` tự bật). Context broker NGSI-LD giữ bản
  # sao số của cảm biến; mỗi đơn vị một tenant NGSI-LD. Không mở cổng nào ra máy chủ. Ba mạng riêng: thiết bị ↔ broker
  # (iot-devices), broker ↔ svc-workflow (iot: thiết bị không gọi được svc-workflow), broker ↔ CSDL của nó (iot-db).
  # Broker không xác thực: ai vào được iot-devices là ghi được vào tenant bất kỳ — thiết bị thật đi qua cổng thiết bị
  # (IoT Agent / PEP proxy cấp tenant theo khóa của thiết bị), bản rút gọn chỉ có cảm biến giả lập.
  scorpio-db:
    <<: *common
    # PostGIS (GPL-2.0) — dịch vụ độc lập, Scorpio bắt buộc (dữ liệu vị trí NGSI-LD); ghim cả digest vì thẻ được đẩy lại
    image: postgis/postgis:16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
    profiles: [iot]
    networks: [iot-db]
    environment:
      POSTGRES_USER: scorpio
      POSTGRES_PASSWORD: ${MOC_NGSI_DB_PASSWORD:-}
      POSTGRES_DB: ngb
    volumes:
      - scorpio_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorpio -d ngb"]
      interval: 5s
      timeout: 5s
      retries: 20

  scorpio:
    <<: *common
    image: scorpiobroker/all-in-one-runner:java-6.0.2@sha256:eade45746bd745f738b951b7f398ba0e4e338c8097dab76111e96c6adb3d1e98
    profiles: [iot]
    networks: [iot, iot-devices, iot-db]
    environment:
      DBHOST: scorpio-db
      DBUSER: scorpio
      DBPASS: ${MOC_NGSI_DB_PASSWORD:-}
      DBNAME: ngb
      JAVA_TOOL_OPTIONS: -Xmx384m
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:9090/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      scorpio-db: {condition: service_healthy}

  # Cảm biến nhiệt độ giả lập: chạy một lần (docker compose run), gửi các lần đo vào broker như một thiết bị OT. Profile
  # riêng: bật profile iot thường trực (COMPOSE_PROFILES) không kéo theo dịch vụ chạy một lần này
  ot-sensor:
    <<: *common
    image: moc/svc-workflow:${MOC_VERSION:-dev}
    pull_policy: never  # image của đội, dựng cùng svc-workflow — không kéo từ Docker Hub
    profiles: [iot-sim]
    restart: "no"
    healthcheck:
      disable: true
    networks: [iot-devices]
    entrypoint: ["python", "/ot/sensor.py"]
    environment:
      MOC_NGSI_URL: http://scorpio:9090
    volumes:
      - ./ot/sensor.py:/ot/sensor.py:ro

  # F4.1 — mô hình ngôn ngữ cục bộ cho tác tử đọc văn bản đến, profile ai (tùy chọn: make up-ai). Ollama (MIT) chạy
  # Qwen3 (Apache-2.0) trên CPU; chỉ viết trích yếu khi quy tắc không ra trích yếu tin cậy — số, ngày, cơ quan luôn
  # theo quy tắc. F4.2 — trợ lý hỏi đáp: mô hình nhúng Qwen3-Embedding-0.6B (Apache-2.0) tính véc-tơ cho đoạn văn bản
  # và câu hỏi (tìm theo nghĩa); Qwen3 viết câu trả lời chỉ từ các đoạn đã lọc theo quyền người hỏi, svc-files kiểm
  # trích dẫn trước khi trả. Chỉ nằm mạng ai (internal): không ra Internet, không mở cổng, chỉ svc-files tới được; chỉ
  # nhận thân văn bản không hạn chế. Không bật profile thì mọi thứ vẫn chạy: trích yếu theo quy tắc, trợ lý tìm theo từ
  # khóa và trả câu trích nguyên văn. Trọng số tải một lần bằng make ai-model (dịch vụ ollama-pull bên dưới, cần
  # Internet), nằm ở volume ollama_models.
  ollama:
    <<: *common
    # ghim cả digest (index đa kiến trúc amd64, arm64) vì thẻ của Ollama có thể bị đẩy lại
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: [ai]
    networks: [ai]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      # mô hình sinh và mô hình nhúng (F4.2) cùng nằm trong RAM: mỗi câu hỏi dùng cả hai, không nạp đi nạp lại
      OLLAMA_MAX_LOADED_MODELS: "2"
      # tắt tính năng đám mây của Ollama (suy luận từ xa, tìm kiếm web), thêm vào việc không có Internet
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    # mặc định 6 GB, 4 lõi: đủ cho qwen3:1.7b (≈ 1,4 GB) và qwen3-embedding:0.6b (≈ 0,65 GB) cùng nạp, kèm ngữ cảnh 4096
    # của mô hình sinh và 2048 của mô hình nhúng; MOC_AI_CPUS không được vượt số lõi của máy
    mem_limit: ${MOC_AI_MEM_LIMIT:-6g}
    cpus: ${MOC_AI_CPUS:-4}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Tải trọng số mô hình một lần (make ai-model): chạy một máy chủ Ollama tạm, kéo MOC_AI_MODEL, mô hình nhúng
  # MOC_AI_EMBED_MODEL (F4.2, bỏ qua khi rỗng) và MOC_ASK_MODEL (khi đặt riêng) từ thư viện Ollama vào volume
  # ollama_models rồi in danh sách kèm mã băm để so với DEPENDENCIES.md. Mạng riêng ai-pull có Internet; không chung
  # mạng với dịch vụ nào khác. Profile riêng: bật profile ai thường trực không kéo theo dịch vụ chạy một lần này
  ollama-pull:
    <<: *common
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: [ai-pull]
    restart: "no"
    networks: [ai-pull]
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve >/dev/null 2>&1 &
        for i in $$(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        ollama pull "$$MOC_AI_MODEL" &&
          { [ -z "$$MOC_AI_EMBED_MODEL" ] || ollama pull "$$MOC_AI_EMBED_MODEL"; } &&
          { [ -z "$$MOC_ASK_MODEL" ] || ollama pull "$$MOC_ASK_MODEL"; } &&
          ollama list
    environment:
      MOC_AI_MODEL: ${MOC_AI_MODEL:-qwen3:1.7b}
      MOC_AI_EMBED_MODEL: ${MOC_AI_EMBED_MODEL-qwen3-embedding:0.6b}
      MOC_ASK_MODEL: ${MOC_ASK_MODEL:-}
    volumes:
      - ollama_models:/root/.ollama

  # F3.4 — sao lưu: không chạy thường trực, chỉ `moc backup` gọi (docker compose run), không có mạng. Kho restic
  # (MOC_BACKUP_DIR) gắn vào /repo lúc gọi, không khai ở đây: kho nên nằm trên ổ khác, ngoài thư mục cài.
  restic:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup]
    network_mode: none
    # stdout là bản dump khi khôi phục: không để Docker chép vào nhật ký trên đĩa
    logging: {driver: none}
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${MOC_BACKUP_PASSWORD:-}
    volumes:
      - seaweedfs_data:/data/seaweedfs
      - openbao_data:/data/openbao            # F3.7: khóa transit bọc khóa của tệp văn bản hạn chế

  # ===========================================================================
  # Tầng 2 — ứng dụng
  # ===========================================================================

  # Văn phòng điện tử: trang tĩnh (Nuxt, chế độ SPA), gọi lõi qua APISIX cùng tên miền
  app-office:
    <<: *common
    # schemas/ ở gốc repo nằm ngoài thư mục dựng: đưa vào bằng ngữ cảnh phụ (viết một dòng để make install thay được)
    build: {context: ./apps/office, additional_contexts: {schemas: ./schemas}}
    image: moc/app-office:${MOC_VERSION:-dev}
    profiles: [app]
    environment:
      MOC_REALM: ${MOC_REALM:-moc}

networks:
  moc:
    driver: bridge
  # chỉ seaweedfs và svc-files; không ra Internet
  storage:
    driver: bridge
    internal: true
  # chỉ openbao, svc-files, svc-workflow; không ra Internet
  secrets:
    driver: bridge
    internal: true
  # F3.10: broker NGSI-LD ↔ svc-workflow; thiết bị ↔ broker; broker ↔ CSDL của nó. Không ra Internet
  iot:
    driver: bridge
    internal: true
  iot-devices:
    driver: bridge
    internal: true
  iot-db:
    driver: bridge
    internal: true
  # F4.1: svc-files ↔ Ollama (profile ai). Không ra Internet: mô hình không gửi được thân văn bản đi đâu
  ai:
    driver: bridge
    internal: true
  # chỉ ollama-pull (make ai-model): tải trọng số mô hình từ thư viện Ollama, có Internet
  ai-pull:
    driver: bridge

volumes:
  postgres_data:
  seaweedfs_data:
  prometheus_data:
  scorpio_data:
  clamav_data:
  meili_data:
  openbao_data:
  # tệp đăng nhập AppRole (role_id, secret_id) của từng dịch vụ: két ghi, chỉ dịch vụ đó gắn (chỉ đọc)
  openbao_svc_files:
  openbao_svc_workflow:
  # trọng số mô hình ngôn ngữ (F4.1, profile ai); không sao lưu: tải lại được bằng make ai-model
  ollama_models:
