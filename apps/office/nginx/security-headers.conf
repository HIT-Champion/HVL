# Tiêu đề bảo mật cho mọi phản hồi của giao diện (include trong từng location của default.conf.template).
# CSP: chỉ chạy mã của chính trang và các đoạn nội tuyến đã biết băm; chỉ gọi về cùng tên miền (APISIX).
# frame-src blob: — phòng đọc (F3.8) hiện bản PDF có dấu người xem trong khung từ blob do chính trang tạo (kiểu ép
# application/pdf); svc-files cần token nên không trỏ khung thẳng tới API được.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_scripts; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
# strict-origin (F4.4): Referer chỉ còn gốc tên miền, kể cả yêu cầu cùng nguồn — trang /tim-kiem?q=… không làm câu tìm
# lọt vào Referer của các lời gọi API (error_log của APISIX ghi Referer khi có lỗi, không bỏ được)
add_header Referrer-Policy strict-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
