# Tiêu đề bảo mật cho mọi phản hồi của giao diện (include trong từng location của default.conf.template).
# CSP: chỉ chạy mã của chính trang và các đoạn nội tuyến đã biết băm; chỉ gọi về cùng tên miền (APISIX).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_scripts; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
