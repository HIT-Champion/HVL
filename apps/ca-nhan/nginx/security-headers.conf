# Tiêu đề bảo mật cho mọi phản hồi (include trong từng location của default.conf.template). Trang không có đoạn script
# hay style nội tuyến nào nên CSP chặt hơn app-office: không cần băm, không 'unsafe-inline'. Chỉ gọi về cùng tên miền
# (APISIX). frame-src 'self': oidc-client-ts gia hạn phiên bằng iframe khi không có refresh token.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
