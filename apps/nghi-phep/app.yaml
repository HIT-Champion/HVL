# Đơn nghỉ phép — ứng dụng thứ tư, cắm vào lõi bằng MỘT lệnh, không sửa tệp nào ngoài thư mục này:
#   python3 scripts/moc.py app install apps/nghi-phep/app.yaml     (make app-install APP=apps/nghi-phep/app.yaml)
# Ứng dụng không có máy chủ nghiệp vụ, không bảng riêng: quy trình (BPMN) và form (JSON Schema) khai ở mục workflow,
# lõi triển khai lên động cơ quy trình của nó và mở API chung /api/workflow/nghi-phep/… cho client app-nghi-phep.
# Container chỉ phục vụ trang tĩnh. Cách làm: docs/them-ung-dung.md; trang và kịch bản: README.md cùng thư mục.

name: nghi-phep
title: Đơn nghỉ phép
description: Gửi đơn nghỉ phép, trưởng phòng của chính phòng mình duyệt — quy trình chạy trên động cơ quy trình của lõi
version: 1.0.0
path: /nghi-phep

# Dựng từ thư mục này lúc cài (Dockerfile: Python thư viện chuẩn trên image ghim digest, không root)
image: {build: .}
port: 8080
healthcheck:
  test: [CMD, python3, -c,
         "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/nghi-phep/healthz', timeout=3)"]
  interval: 15s
  timeout: 5s
  retries: 3
memory: 64m

# Manifest bắt buộc có mục database. Ứng dụng không có bảng nào nên không khai migration: lõi chỉ tạo schema trống
# nghi_phep và vai trò CSDL của nó. Đơn, quyết định nằm trong động cơ quy trình của lõi
database:
  schema: nghi_phep

# Process id và formKey đều mang tiền tố "nghi-phep." (tên ứng dụng); form kiểm ở cả trình duyệt
# (public/schema-form.js) lẫn lõi khi nhận dữ liệu
workflow:
  processes: [workflow/don-nghi-phep.bpmn20.xml]
  forms:
    nghi-phep.don: forms/don.json
    nghi-phep.duyet: forms/duyet.json
