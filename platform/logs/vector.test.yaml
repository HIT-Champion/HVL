  - name: sự kiện đăng nhập lỗi của Keycloak che tên gõ vào, phiên, chuỗi truy vấn; giữ userId, clientId, lỗi
    inputs:
      - insert_at: moc
        type: log
        log_fields:
          '"com.docker.compose.service"': keycloak
          log: >-
            2026-10-25 16:50:01,123 WARN  [org.keycloak.events] (executor-thread-3) type="LOGIN_ERROR",
            realmId="9b1f", realmName="moc", clientId="app-office", userId="2f6c", sessionId="phien-123",
            ipAddress="172.18.0.9", error="invalid_user_credentials", auth_method="openid-connect",
            redirect_uri="https://signet.example/callback?state=TT9", code_id="c-1", username="Mk go nham 123"
    outputs:
      - extract_from: moc
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "keycloak")
              m = string!(.message)
              for_each(["Mk go nham", "phien-123", "state=TT9"]) -> |_i, s| {
                assert!(!contains(m, s), s)
              }
              assert!(contains(m, "username=\"[REDACTED]\""), m)
              assert!(contains(m, "userId=\"2f6c\""), m)
              assert!(contains(m, "clientId=\"app-office\""), m)
              assert!(contains(m, "error=\"invalid_user_credentials\""), m)
              assert!(contains(m, "redirect_uri=\"https://signet.example/callback\""), m)
