# Vector (profile logs, F3.14 — docs/van-hanh.md mục Log tập trung): nhận log của apisix, app-office, app-ca-nhan,
# svc-files, svc-workflow, hasura, keycloak, postgres, meilisearch qua driver fluentd của Docker
# (platform/logs/docker-compose.logs.yml), tách mã yêu cầu, che lần hai thứ không được rời máy, gửi Parseable. Năm dịch
# vụ đầu tự che (F4.4), ở đây chỉ là lưới an toàn cho dòng lọt qua (dòng lỗi nginx, traceback). Bốn dịch vụ sau không
# tự che: luật riêng cho từng dịch vụ bên dưới, rồi qua cùng bước che chung. Kiểm: vector validate, vector test
# (platform/logs/vector.test.yaml).
secret:
  tep:
    type: directory
    path: /run/secrets          # compose secret moc_logs_password (environment: MOC_LOGS_PASSWORD)
    remove_trailing_whitespace: true

sources:
  docker:
    type: fluent
    mode: tcp
    address: 0.0.0.0:24224      # compose chỉ mở 127.0.0.1:MOC_LOGS_FLUENT_PORT trên máy chủ
    connection_limit: 64

transforms:
  # Docker cắt dòng dài hơn 16 KiB thành nhiều bản ghi (partial_message, partial_id, partial_last): ghép lại trước khi
  # che, không thì bí mật nằm vắt qua chỗ cắt lọt qua. Bản ghi thường đi tiếp ngay. Nhóm theo container và mã mảnh:
  # mảnh của hai container (hay stdout, stderr của một container) xen nhau không bị trộn
  ghep:
    type: reduce
    inputs: [docker]
    group_by: [container_id, partial_id]
    merge_strategies:
      log: concat_raw
    ends_when:
      type: vrl
      source: .partial_message != "true" || .partial_last == "true"
    max_events: 64              # dòng tới 1 MiB; quá thì gửi phần đã ghép
    expire_after_ms: 10000      # mảnh cuối không tới (container chết) thì gửi phần đã có

  moc:
    type: remap
    inputs: [ghep]
    drop_on_error: true         # lỗi lúc chạy thì bỏ dòng, không gửi nguyên văn chưa che
    source: |
      service = string(."com.docker.compose.service") ?? "khong-ro"
      line = string(.log) ?? string(.message) ?? ""
      out = {"service": service, "container": string(.container_name) ?? "", "stream": string(.source) ?? "",
             "timestamp": .timestamp}
      msg = line
      rid = ""
      is_json = false
      # Dòng JSON của svc-files, svc-workflow, Hasura: lấy event, request_id. Viết lại dòng từ bản đã giải mã: ký tự
      # thoát (\u0040 thay @…) không giấu được chữ khỏi bước che, xuống dòng và ký tự điều khiển được thoát lại
      parsed, err = parse_json(line)
      if err == null && is_object(parsed) {
        is_json = true
        ev = string(parsed.event) ?? ""
        rid = string(parsed.request_id) ?? ""
        if service == "hasura" {
          # Hasura: loại log (http-log, websocket-log…) làm event. Mã yêu cầu (X-Request-Id của APISIX, svc-workflow,
          # svc-files; không có thì Hasura tự sinh) nằm trong detail, ở websocket-log thì trong detail.event.detail
          ev = "hasura." + (string(parsed.type) ?? "")
          rid = string(parsed.detail.request_id) ?? string(parsed.detail.operation.request_id) ?? ""
          if rid == "" { rid = string(parsed.detail.event.detail.request_id) ?? "" }
        }
        if service == "meilisearch" {
          # Meilisearch ghi JSON (MEILI_EXPERIMENTAL_LOGS_MODE trong docker-compose.yml): mỗi yêu cầu HTTP một dòng lúc
          # đóng span "HTTP request". /health trả 200 (bảng trạng thái, /readyz của svc-files hỏi liên tục) bỏ cả dòng
          if (string(parsed.span.route) ?? "") == "/health" && (to_string(parsed.span.status_code) ?? "") == "200" {
            abort
          }
          ev = "meilisearch." + replace(string(parsed.target) ?? "", "::", ".")
          if (string(parsed.span.name) ?? "") == "HTTP request" { ev = "meilisearch.http" }
        }
        if match(ev, r'^[A-Za-z0-9._:-]{1,128}$') { out.event = ev }
        # Khóa bí mật ở mọi tầng (kể cả giá trị là số, null, object lồng): thay cả giá trị trước khi viết lại
        flat = flatten(object!(parsed))
        for_each(flat) -> |k, v| {
          if match(k, r'(?i)passw|pwd|secret|token|api[_-]?key|private[_-]?key|credential|session|authoriz|cookie') {
            flat = set!(flat, [k], "[REDACTED]")
          }
          # Hasura ghi câu GraphQL và biến (dữ liệu người dùng) mỗi lần mở subscription. Khóa query, raw_query (câu
          # GraphQL, SQL, thân yêu cầu dạng chuỗi) thay giá trị; query.variables, generated_sql (query-log, mặc định
          # tắt, có prepared_arguments) và internal của lỗi (tham số, câu SQL, DETAIL của PostgreSQL) thay cả nhánh:
          # khóa trong biến jsonb cũng là dữ liệu. Bản 2.51 không ghi internal, raw_query vào http-log (đã thử cả
          # DEV_MODE true): luật để phòng bản khác. Giữ operationName
          if service == "hasura" {
            q, qerr = parse_regex(k, r'^(?P<p>(?:[^.]+\.)*?(?:query\.variables|generated_sql|internal))(?:\.|$)')
            if qerr == null {
              flat = remove!(flat, [k])
              flat = set!(flat, [string!(q.p)], "[REDACTED]")
            } else if match(k, r'(^|\.)(?:raw_)?query$') && is_string(v) {
              flat = set!(flat, [k], "[REDACTED]")
            }
          }
          # Meilisearch không tự che: query_parameters (gọi GET thì câu tìm q=…, biểu thức filter=…) và error (lời lỗi
          # trích giá trị tài liệu, biểu thức lọc, có khi nhiều dòng) thay cả giá trị; spans lặp lại span nên bỏ. Chuỗi
          # khác: Meilisearch trích giá trị trong dấu ` (Document identifier `…` is invalid), dấu lồng nhau được nên
          # thay từ dấu ` đầu tiên tới hết chuỗi
          if service == "meilisearch" {
            if match(k, r'^spans(\.|$)') {
              flat = remove!(flat, [k])
            } else if match(k, r'(^|\.)(?:query_parameters|error)$') && v != "" {
              flat = set!(flat, [k], "[REDACTED]")
            } else if is_string(v) {
              flat = set!(flat, [k], replace(string!(v), r'(?s)`.*', "`[REDACTED]"))
            }
          }
        }
        msg = encode_json(unflatten(flat))
      } else {
        # Dòng lỗi nginx của APISIX: ..., request_id: "…"; dòng truy cập APISIX: trường cuối "$apisix_request_id".
        # Dòng nginx của app-office kết thúc bằng "$http_x_forwarded_for" (IP): không lấy làm mã
        m, err = parse_regex(line, r'request_id: "(?P<rid>[^"]*)"')
        if err != null && service == "apisix" {
          m, err = parse_regex(line, r'^\S+ - \S+ \[[^\]]*\] .*"(?P<rid>[^"]*)"\s*$')
        }
        if err == null { rid = string(m.rid) ?? "" }
        # Meilisearch ghi chữ (bỏ MEILI_EXPERIMENTAL_LOGS_MODE): cùng luật như bản JSON ở trên. Dòng tiếp của lời lỗi
        # nhiều dòng không biết thuộc dòng nào: bản chữ chỉ là đường lùi, cấu hình mặc định ghi JSON
        if service == "meilisearch" {
          msg = replace(msg, r'(\bquery_parameters=)\S*', "${1}[REDACTED]")
          msg = replace(msg, r'(\berror=).*', "${1}[REDACTED]")
          msg = replace(msg, r'`.*', "`[REDACTED]")
        }
      }
      if service == "postgres" {
        # Mỗi mục log của PostgreSQL bắt đầu bằng tiền tố mặc định "%m [%p] " rồi loại (ERROR:, DETAIL:…). Dòng không
        # có tiền tố là dòng tiếp của mục nhiều dòng (câu lệnh, dòng vi phạm có xuống dòng) hay lời của script khởi
        # tạo: không biết thuộc mục nào nên không che đúng được, bỏ
        p, err = parse_regex(msg, r'^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d+ \S+ \[\d+\] (?P<kind>[A-Z0-9]+):')
        if err != null { abort }
        kind = string(p.kind) ?? ""
        # Câu lệnh lỗi (STATEMENT; QUERY là câu bên trong hàm PL/pgSQL) có thể mang giá trị: chỉ giữ từ đầu
        if kind == "STATEMENT" || kind == "QUERY" {
          msg = replace(msg, r'^(\S+ \S+ \S+ \[\d+\] [A-Z]+:\s+[A-Za-z]{0,16}).*', "${1} [REDACTED]")
        }
        # DETAIL: giá trị khóa Key (cột)=(giá trị), dòng vi phạm Failing row contains (…), Token "…" của JSON sai.
        # Giá trị có xuống dòng thì dòng dừng giữa giá trị (phần sau là dòng tiếp, đã bỏ): thiếu dấu đóng thì che tới
        # hết dòng (nhóm c rỗng); cùng cách cho CONTEXT, tham số, giá trị gõ sai kiểu bên dưới
        if kind == "DETAIL" {
          msg = replace(msg, r'\)=\((?:.*(?P<c>\))|.*)', ")=([REDACTED]${c}")
          msg = replace(msg, r'(\bcontains )\((?:.*(?P<c>\))|.*)', "${1}([REDACTED]${c}")
          msg = replace(msg, r'(\bToken )"(?:.*(?P<c>")|.*)', "${1}\"[REDACTED]${c}")
        }
        # CONTEXT: câu trong nháy (SQL statement "…"), đoạn trích sau "line N:" (JSON data, COPY … column c)
        if kind == "CONTEXT" {
          msg = replace(msg, r'"(?:.*(?P<c>")|.*)', "\"[REDACTED]${c}")
          msg = replace(msg, r'(, line \d+(?:, column [^:\n]*)?:\s*).+', "${1}[REDACTED]")
        }
        # Tham số câu lệnh ($1 = '…') khi bật log_parameter_max_length_on_error hay log_statement
        msg = replace(msg, r'(\$\d+ = )\x27(?:(?:[^\x27]|\x27\x27)*(?P<c>\x27)|.*)', "${1}'[REDACTED]${c}")
      }
      # Keycloak ghi tên đăng nhập người dùng gõ ở LOGIN_ERROR: gõ nhầm mật khẩu vào ô tên thì lộ. userId vẫn giữ
      if service == "keycloak" {
        msg = replace(msg, r'(\busername=)"(?:[^"\\]|\\.)*"', "${1}\"[REDACTED]\"")
      }
      # Chỉ nhận mã đúng dạng, cùng luật với svc-workflow và make logs-tra: mã dài, có dấu cách, PII… bỏ
      if match(rid, r'^[A-Za-z0-9._:-]{1,128}$') { out.request_id = rid }

      # Dòng không phải JSON có thể chứa đoạn JSON viết thoát (pass\u0077ord): giải mã các chuỗi \u00XX là ký tự
      # ASCII in được trước khi che. Chỉ là mã thoát khi đứng sau số chẵn dấu \ (\\u… là dấu \ thật rồi chữ u)
      msg = replace_with(msg, r'(^|[^\\])((?:\\\\)*)((?:\\u00(?:[2-6][0-9a-fA-F]|7[0-9a-eA-E]))+)') -> |m| {
        d, e = parse_json("\"" + (string(m.captures[2]) ?? "") + "\"")
        (string(m.captures[0]) ?? "") + (string(m.captures[1]) ?? "") + (string(d) ?? string(m.captures[2]) ?? "")
      }
      # Ba dấu tạm của bước che có sẵn trong dòng (dòng giả, giá trị chứa ␟) thì bỏ trước: không chen được vào bước che
      msg = replace(msg, r'[␟␝␞]', "")
      # Token Bearer/Basic, JWT che trước khi đánh dấu khóa: dấu = đệm cuối base64 (Basic dXNlcjpwYXNzd29yZA==) không
      # bị coi là một cặp khóa=giá trị chen dấu ␟ vào giữa
      msg = replace(msg, r'(?i)\b(bearer|basic)\s+[A-Za-z0-9._~+/=-]{8,}', "${1} [REDACTED]")
      msg = replace(msg, r'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*', "[JWT]")

      # Che lần hai. Ba dấu chỉ dùng trong lúc che, xóa ngay sau: ␟ trước mỗi khóa (a=, "a":, 'a':) để giá trị không
      # có nháy, kể cả có dấu cách, dừng ở khóa kế tiếp; ␝ sau Authorization:, Cookie:, Set-Cookie: (che cả giá trị:
      # trong nháy thì tới hết nháy; không nháy thì tới hết dòng, kể cả Digest username="u", response="…", trong dòng
      # JSON thì tới hết chuỗi); ␞ sau khóa có chữ password, secret, token, api key, session… kể cả có tiền tố, hậu tố
      # (HASURA_ADMIN_SECRET=, access_token, x-api-key), và sau đối số dòng lệnh như --password ('--password', 'X' của
      # list Python, mảng JSON, hay --password X). \x27 là dấu nháy đơn (dict Python in trong traceback). Giá trị dạng
      # a=b cũng bị đánh ␟ ở đầu: luật giá trị cho phép một ␟ ngay sau ␝, ␞. Nháy mở mà không đóng (dòng bị cắt giữa
      # giá trị: %.200s, repr(x)[:n]): dòng thường che tới hết dòng, trong dòng JSON tới hết chuỗi
      msg = replace(msg, r'(^|[\s,;{(\[])(["\x27]?[\w.-]+["\x27]?\s*[:=])', "${1}␟${2}")
      msg = replace(msg, r'(?i)([\w-]*(?:authorization|cookie)[\w-]*\\?["\x27]?\s*[:=]\s*)', "${1}␝")
      msg = replace(msg, r'(?i)([\w-]*(?:passw|pwd|secret|token)[\w-]*\\?["\x27]?\s*[:=]\s*)', "${1}␞")
      msg = replace(msg, r'(?i)([\w-]*(?:api[_-]?key|private[_-]?key|credential|session)[\w-]*\\?["\x27]?\s*[:=]\s*)',
                    "${1}␞")
      msg = replace(msg, r'(?i)(["\x27]--?[\w-]*(?:passw|pwd|secret|token|key|credential)[\w-]*\\?["\x27]\s*,\s*)',
                    "${1}␞")
      msg = replace(msg, r'(?i)((?:^|\s)--?[\w-]*(?:passw|pwd|secret|token|key|credential)[\w-]*\s+)([^\s-])',
                    "${1}␞${2}")
      msg = replace(msg, r'␝␟?\\?"(?:[^"\\]|\\.)*"', "\"[REDACTED]\"")
      msg = replace(msg, r'␝␟?\x27(?:[^\x27\\]|\\.)*\x27', "'[REDACTED]'")
      if is_json {
        msg = replace(msg, r'␝␟?[^"\s\\](?:[^"\\\n]|\\.)*', "[REDACTED]")
      } else {
        msg = replace(msg, r'␝␟?.+', "[REDACTED]")
      }
      msg = replace(msg, r'␞␟?\\?"(?:[^"\\]|\\.)*"', "\"[REDACTED]\"")
      msg = replace(msg, r'␞␟?\x27(?:[^\x27\\]|\\.)*\x27', "'[REDACTED]'")
      msg = replace(msg, r'␞␟?[^"\x27\s␟␞][^␟"\n]*?(\s*␟|"|$)', "[REDACTED]${1}")
      if is_json {
        msg = replace(msg, r'␞␟?\x27(?:[^"\\\n]|\\.)*', "[REDACTED]")
      } else {
        msg = replace(msg, r'␞␟?\\?["\x27].*', "[REDACTED]")
      }
      msg = replace(msg, r'[␟␝␞]', "")
      # Mật khẩu trong chuỗi kết nối: scheme://người:mật-khẩu@máy
      msg = replace(msg, r'(?i)([a-z][a-z0-9+.-]*://[^:/\s@"\x27]*:)[^@\s/"\x27]+@', "${1}[REDACTED]@")
      # Giá trị gõ sai kiểu mà PostgreSQL nhắc lại trong lời lỗi (Hasura chuyển nguyên lời này vào log của nó):
      # invalid input syntax for type uuid: "…", malformed array literal: "…". Dòng chữ và chuỗi JSON (\"…\")
      msg = replace(msg, r'(\b(?:invalid input (?:syntax|value) for|malformed)[^:"\n]*:\s*)"(?:.*(?P<c>")|.*)',
                    "${1}\"[REDACTED]${c}")
      msg = replace(msg, r'(\b(?:invalid input (?:syntax|value) for|malformed)[^:"\n]*:\s*)\\"(?:[^"\\]|\\[^"])*\\"',
                    "${1}\\\"[REDACTED]\\\"")
      # Chuỗi truy vấn (câu tìm, ?code=…&state=…) của mọi chuỗi có / trước ? (URL tuyệt đối, tương đối, máy:cổng/đường
      # dẫn): trong nháy (giá trị có dấu cách, trường JSON, referrer) hoặc không (dòng request của nginx, uvicorn)
      msg = replace(msg, r'(?P<u>"[^\s"?/]*/[^\s"?]*)\?(?:[^"\\]|\\.)*"', "${u}\"")
      msg = replace(msg, r'(?P<u>(?:^|[\s=(\x27])[^\s"\x27?/]*/[^\s"\x27?]*)\?[^\s"\x27]*', "${u}")
      # Lưới thô cho PII, không thay F4.4. Email cả chữ có dấu, @ viết %40 (\u0040 đã giải mã ở trên). Số đứng sau từ
      # khóa, kể cả viết tách nhóm: CCCD, CMND từ 9 số; số tài khoản, mã số thuế từ 6 số; số điện thoại từ 8 số. Từ
      # khóa không dính chữ cái phía sau (telemetry không phải tel), giữa từ khóa và số tới 20 ký tự không phải chữ số.
      # CCCD 12 số; số điện thoại 0…, +84…, 84… (di động 10 số, cố định 11 số) kể cả không có từ khóa, dính chữ
      # (sđt0912…), chỉ cần không dính chữ số khác. Mỗi luật số không từ khóa chạy hai lần: hai số liền nhau chỉ cách
      # một ký tự
      msg = replace(msg, r'(?i)[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}-]+(?:\.[\p{L}\p{N}-]+)*\.\p{L}{2,}', "[EMAIL]")
      msg = replace(msg, r'(?i)(\b(?:cccd|c[ăa]n c[ưu][ớo]c)(?:[^\p{L}\d\n][^\d\n]{0,19}?)?)\d(?:[ .-]?\d){8,}',
                    "${1}[CCCD]")
      msg = replace(msg, r'(?i)(\b(?:cmnd|cmt|ch[ứu]ng minh)(?:[^\p{L}\d\n][^\d\n]{0,19}?)?)\d(?:[ .-]?\d){8,}',
                    "${1}[CMND]")
      msg = replace(msg, r'(?i)(\b(?:stk|t[àa]i kho[ảa]n)(?:[^\p{L}\d\n][^\d\n]{0,19}?)?)\d(?:[ .-]?\d){5,}',
                    "${1}[STK]")
      msg = replace(msg, r'(?i)(\b(?:mst|m[ãa] s[ốo] thu[ếe])(?:[^\p{L}\d\n][^\d\n]{0,19}?)?)\d(?:[ .-]?\d){5,}',
                    "${1}[MST]")
      msg = replace(msg,
        r'(?i)(\b(?:s[đd]t|tel|fax|phone|đi[ệe]n tho[ạa]i)(?:[^\p{L}\d\n+][^\d\n]{0,19}?)?)\+?\d(?:[ .()-]{0,2}\d){7,}',
        "${1}[SĐT]")
      msg = replace(msg, r'(^|\D)0\d{11}(\D|$)', "${1}[CCCD]${2}")
      msg = replace(msg, r'(^|\D)0\d{11}(\D|$)', "${1}[CCCD]${2}")
      msg = replace(msg, r'(^|\D)(?:\+?84|0)(?:[35789]\d{8}|2\d{9})(\D|$)', "${1}[SĐT]${2}")
      msg = replace(msg, r'(^|\D)(?:\+?84|0)(?:[35789]\d{8}|2\d{9})(\D|$)', "${1}[SĐT]${2}")
      out.message = truncate(msg, 16384)
      # Chỉ gửi các trường trên: container_id, nhãn khác của bản ghi gốc không đi tiếp
      . = out

sinks:
  parseable:
    type: http
    inputs: [moc]
    uri: http://parseable:8000/api/v1/ingest
    method: post
    encoding:
      codec: json
    compression: gzip
    auth:
      strategy: basic
      user: moc
      # Vector ≥ 0.57 mặc định không thay ${…} trong cấu hình: mật khẩu lấy từ secret, không từ biến môi trường
      password: "SECRET[tep.moc_logs_password]"
    request:
      headers:
        X-P-Stream: moc         # scripts/log_tap_trung.py (STREAM) tra đúng luồng này
    batch:
      max_events: 500
      timeout_secs: 2
    buffer:
      type: memory
      max_events: 10000
