# Truy vết phân tán (#364, profile trace): Jaeger 2.22 nhận span OTLP/HTTP của APISIX, svc-files, svc-workflow ở cổng
# 4318 (chỉ trong mạng moc), giữ 10 000 trace mới nhất trong RAM, giao diện ở cổng 16686 (compose chỉ mở trên
# 127.0.0.1). Dựng theo cmd/jaeger/config-badger.yaml của bản 2.22.0: bỏ OTLP gRPC, kho lưu trữ, chỉ số; đổi Badger
# sang kho RAM. Kiểm cú pháp: CI chạy `jaeger validate` bằng image ghim trong docker-compose.yml

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/che, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    # mặc định mở cổng chỉ số 8888; Prometheus của Signet không thu Jaeger
    metrics:
      level: none
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: ram
    # mặc định Jaeger tự ghi span của chính nó, gửi tới localhost:4317 (không có gì nghe ở đó)
    enable_tracing: false
    http:
      endpoint: 0.0.0.0:16686
    # giao diện chỉ dùng HTTP; API gRPC không mở ra mạng moc
    grpc:
      endpoint: 127.0.0.1:16685

  # Kho RAM có trần, mất khi container khởi động lại: đủ để dò một yêu cầu chậm hay lỗi. Đo 28/10/2026 (trace 6 span):
  # nghỉ 11 MiB, 20 000 trace dồn trong vài giây lên đỉnh 123 MiB. Badger (lưu đĩa) giữ ~570 MiB sau 80 000 trace 2 span
  # gửi dồn, và bị giết ở trần 256m của compose
  jaeger_storage:
    backends:
      ram:
        memory:
          max_traces: 10000

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Lớp che thứ hai (lớp đầu: svc-files, svc-workflow tự che trước khi gửi, tracing.py). http.target của APISIX là
  # $request_uri, mang chuỗi truy vấn (ô tìm kiếm ?q=…, mã đăng nhập ?code=…&state=…); url.path giữ đường dẫn
  attributes/che:
    actions:
      - key: http.target
        action: delete
      - key: url.query
        action: delete
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: ram
