# Theme đăng nhập Signet: kế thừa nguyên template FreeMarker và PatternFly 5 của keycloak.v2 (theme đăng nhập có sẵn
# trong image Keycloak 26 ghim ở docker-compose.yml), chỉ thêm CSS và logo. Chế độ tối (darkMode=true), bản dịch tiếng
# Việt, các trang mật khẩu, TOTP, đổi mật khẩu đều lấy từ theme cha; tên ở đầu trang là displayName của realm.
parent=keycloak.v2
import=common/keycloak

# css/styles.css là của keycloak.v2 (Keycloak tìm tài nguyên lần lượt từ theme này lên theme cha), signet.css phủ lên
styles=css/styles.css css/signet.css
# Biểu tượng tab: đúng logo của Văn phòng điện tử (apps/office/public/favicon.svg)
favicons=img/signet.svg
