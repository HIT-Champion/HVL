# Theme đăng nhập Signet "Liền mạch": kế thừa nguyên template FreeMarker và PatternFly 5 của keycloak.v2 (theme đăng
# nhập có sẵn trong image Keycloak 26 ghim ở docker-compose.yml), chỉ thêm CSS, phông, logo và một chuỗi tiêu đề. Bản
# dịch tiếng Việt, các trang mật khẩu, TOTP, đổi mật khẩu lấy từ theme cha; tên ở đầu trang là displayName của realm.
parent=keycloak.v2
import=common/keycloak
# Chỉ chế độ sáng như Văn phòng điện tử: keycloak.v2 mặc định đổi sang tối theo máy, màu của signet.css chỉ cho nền sáng
darkMode=false

# css/styles.css là của keycloak.v2 (Keycloak tìm tài nguyên lần lượt từ theme này lên theme cha), signet.css phủ lên.
# fonts/be-vietnam-pro/be-vietnam-pro.css: @font-face của gói npm @fontsource/be-vietnam-pro, không có trong repo —
# dịch vụ keycloak-fonts chép vào volume gắn ở resources/fonts/be-vietnam-pro (#305)
styles=css/styles.css fonts/be-vietnam-pro/be-vietnam-pro.css css/signet.css
# Biểu tượng tab: đúng logo của Văn phòng điện tử (apps/office/public/favicon.svg)
favicons=img/signet.svg
