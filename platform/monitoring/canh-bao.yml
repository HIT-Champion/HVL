# F3.13 — luật cảnh báo (#255), tính trên chỉ số APISIX mà Prometheus đang thu. Nhãn `route` là id route trong
# platform/apisix/apisix.yaml. Chưa có Alertmanager: cảnh báo chỉ hiện ở Prometheus (/alerts) và bảng điều khiển
# Grafana, không gửi ra ngoài. Test: platform/monitoring/kiem-tra/canh-bao.test.yml (promtool test rules, bước CI
# "Giám sát"). Cảnh báo dựa trên lưu lượng thật: không ai gọi tới thì không thấy dịch vụ chết.
groups:
  - name: cong-api
    rules:
      - alert: GatewayMetricsDown
        expr: up{job="apisix"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus không thu được chỉ số của cổng API — APISIX có thể đã dừng

      # 502, 504 là mã APISIX tự sinh khi upstream chết hoặc quá giờ. 503 thì không: svc-files trả 503 có chủ ý
      # (busy, scanner_unavailable… kèm Retry-After), trang trạng thái trả 503 khi có thành phần lỗi — 503 chỉ tính
      # vào tỉ lệ 5xx. Cửa sổ 1 phút, kéo dài 3 phút: một lỗi lẻ (vd lúc khởi động lại) không bật cảnh báo.
      # svc-workflow không có route riêng (nằm sau Hasura Actions, lỗi của nó về trình duyệt là GraphQL 200 có
      # errors): route graphql chỉ báo Hasura không trả lời.
      - alert: UpstreamUnreachable
        expr: sum by (route) (rate(apisix_http_status{code=~"502|504"}[1m])) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Route {{ $labels.route }}: dịch vụ sau cổng không trả lời (502/504 liên tục)"

      # Có sàn lưu lượng: trang ít người dùng thì một lỗi lẻ đã là 100%
      - alert: High5xxRatio
        expr: |
          sum(rate(apisix_http_status{code=~"5.."}[5m])) / sum(rate(apisix_http_status[5m])) > 0.05
          and sum(rate(apisix_http_status[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hơn 5% yêu cầu qua cổng API lỗi 5xx trong 5 phút

      # Chỉ route tương tác. Không tính realtime (WebSocket mở lâu) và svc-files: tải lên + quét ClamAV, đọc văn bản
      # đến (tới 50 giây), hỏi đáp, xuất lô, ký số vốn chậm theo thiết kế. Độ trễ APISIX tính bằng mili giây.
      - alert: SlowRoute
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(apisix_http_latency_bucket{type="request",
            route=~"graphql|app-office|app-ca-nhan|keycloak|dang-nhap|dang-nhap-post"}[5m]))) > 3000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Route {{ $labels.route }}: p95 thời gian trả lời trên 3 giây trong 10 phút"

  - name: prometheus
    rules:
      - alert: AlertRulesFailing
        expr: sum(increase(prometheus_rule_evaluation_failures_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Prometheus tính luật cảnh báo bị lỗi — cảnh báo có thể không bật khi cần
