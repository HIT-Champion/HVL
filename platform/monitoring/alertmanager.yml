# F3.13, #284 — Alertmanager nhận cảnh báo đang bật từ Prometheus (luật trong canh-bao.yml), gom, chống gửi dồn rồi
# gọi svc-workflow: mỗi cảnh báo thành một thông báo ops.alert ở chuông của quản trị đơn vị (vai trò tenant_admin), kèm
# email, webhook, SMS, Zalo nếu bản cài đã cấu hình kênh đó (MOC_NOTIFY_*_KINDS). Token trong tệp do alertmanager.sh
# ghi từ MOC_ALERT_TOKEN lúc khởi động; chưa có token thì alertmanager.sh chạy alertmanager-khong-gui.yml.
route:
  receiver: signet
  # mỗi luật một nhóm: ComponentDown của hai thành phần đi chung một lần gọi, mỗi cảnh báo vẫn là một thông báo
  group_by: [alertname]
  # lần gửi đầu của nhóm chờ 30 giây (gom các cảnh báo bật cùng lúc); phần đổi sau đó (cảnh báo mới, hết cảnh báo)
  # gửi mỗi phút
  group_wait: 30s
  group_interval: 1m
  # còn bật thì nhắc lại sau 12 giờ; svc-workflow chống trùng theo fingerprint + startsAt nên lần nhắc không thêm dòng
  repeat_interval: 12h

receivers:
  - name: signet
    webhook_configs:
      - url: http://svc-workflow:8000/ops/alerts
        send_resolved: true
        # svc-workflow trả 400 nếu một lần gọi quá 50 cảnh báo (alerts.MAX_ALERTS)
        max_alerts: 50
        timeout: 30s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/moc-alert-token
