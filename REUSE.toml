# Khai bản quyền và giấy phép theo chuẩn REUSE (https://reuse.software) cho các tệp không chèn được header:
# JSON không có cú pháp chú thích; ảnh, PDF là tệp nhị phân; tài liệu Markdown, dữ liệu mẫu, tệp cấu hình công cụ.
# Tệp mã nguồn vẫn mang header riêng (scripts/license-header.sh, make license-check); header trong tệp được ưu tiên
# hơn khai ở đây (precedence = "closest"). Mọi tệp khớp dưới đây đều do đội viết hoặc sinh từ mã của đội.
# Toàn văn giấy phép: LICENSES/Apache-2.0.txt (giống hệt LICENSE). Kiểm: uvx --from reuse==5.0.2 reuse lint

version = 1

[[annotations]]
path = [
  # Tài liệu
  "**.md",
  "NOTICE",
  # Dữ liệu và cấu hình dạng JSON: schema, realm Keycloak, bảng điều khiển Grafana, ruleset, tệp khóa phụ thuộc,
  # chuỗi giao diện, OpenAPI xuất từ dịch vụ, dữ liệu mẫu
  "**.json",
  # Danh sách phụ thuộc Python kèm băm
  "**.txt",
  # Dữ liệu mẫu và dữ liệu kiểm thử
  "**.csv",
  "**.tsv",
  # Văn bản mẫu giả lập (scripts/van_ban_mau.py, scripts/hoi_dap_mau.py), ảnh chụp màn hình, biểu tượng
  "**.pdf",
  "**.png",
  "**.jpg",
  "**.svg",
  # Cấu hình công cụ
  "**.gitignore",
  "**.dockerignore",
  ".editorconfig",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Signet Team"
SPDX-License-Identifier = "Apache-2.0"

# Logo của các dự án nguồn mở trong sơ đồ kiến trúc: nhãn hiệu và tác phẩm của chủ sở hữu từng dự án, chỉ để nhận diện
# thành phần, không thuộc giấy phép Apache-2.0 của Signet (LICENSES/LicenseRef-Logos.txt; nguồn từng tệp:
# docs/anh/logo/NGUON.md). Khai sau khối trên nên ghi đè "**.png" cho các tệp này.
[[annotations]]
path = "docs/anh/logo/*.png"
precedence = "closest"
SPDX-FileCopyrightText = "Chủ sở hữu từng dự án, xem docs/anh/logo/NGUON.md"
SPDX-License-Identifier = "LicenseRef-Logos"

# Phông giao diện Be Vietnam Pro (#116): tệp nguyên bản của dự án Be Vietnam Pro, giấy phép SIL OFL-1.1 (kèm OFL.txt
# trong từng thư mục phông, toàn văn ở LICENSES/OFL-1.1.txt). Khai sau khối đầu nên ghi đè "**.txt" cho OFL.txt.
[[annotations]]
path = [
  "apps/office/public/fonts/be-vietnam-pro/**",
  "platform/keycloak/themes/signet/login/resources/fonts/be-vietnam-pro/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2021 The Be Vietnam Pro Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Ảnh sơ đồ kiến trúc: đội vẽ (scripts/so_do_kien_truc.py), bên trong có các logo ở trên
[[annotations]]
path = ["docs/anh/kien-truc-tong-the.gif", "docs/anh/kien-truc-tong-the.en.gif"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Signet Team", "Logo: chủ sở hữu từng dự án, xem docs/anh/logo/NGUON.md"]
SPDX-License-Identifier = "Apache-2.0 AND LicenseRef-Logos"
