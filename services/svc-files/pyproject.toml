# Khai báo phụ thuộc trực tiếp. Phiên bản khóa cụ thể (kèm băm) nằm trong
# requirements.txt và requirements-dev.txt, sinh lại bằng lệnh ở README.md.

[project]
name = "svc-files"
version = "0.1.0"
description = "Signet — dịch vụ tệp: kiểm dịch ClamAV rồi mới lưu vào SeaweedFS; dựng PDF văn bản đi; cổng xác thực"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.3,<0.144",
  "uvicorn>=0.54,<0.55",
  "python-multipart>=0.0.32",
  "boto3>=1.43,<2",
  "pyjwt[crypto]>=2.15,<3",
  "cryptography>=50,<51",
  "httpx2>=2.13,<3",
  "weasyprint>=70,<71",
  "duckdb==1.5.6",
  "segno>=1.6,<2",
  "pypdf>=6.21.2,<7",  # 6.21.2 vá GHSA-6c7f, -gmh7, -jr96 (OSV 24/10); 6.21.1 vá 5 GHSA (OSV 22/10)
  "pyhanko==0.37.0",    # ký số PAdES văn bản đi (F4.5, chỉ minh họa)
  "pillow>=13,<14",     # OCR (F4.1), bỏ EXIF ảnh tải lên (imageclean.py) — trước đây chỉ có gián tiếp qua WeasyPrint
  # truy vết phân tán (#364, tracing.py): chỉ nạp khi MOC_TRACE_RATIO > 0
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "integration: cần ClamAV và SeaweedFS đang chạy; bật bằng MOC_IT=1",
]
