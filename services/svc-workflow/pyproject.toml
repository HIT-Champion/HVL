# Khai báo phụ thuộc trực tiếp. Phiên bản khóa cụ thể (kèm băm) nằm trong
# requirements.txt và requirements-dev.txt, sinh lại bằng lệnh ở README.md.

[project]
name = "svc-workflow"
version = "0.1.0"
description = "Mộc — Hasura Actions của Văn phòng điện tử, nối PostgreSQL với Flowable"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.3,<0.144",
  "uvicorn>=0.54,<0.55",
  "httpx2>=2.13,<3",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "integration: cần Flowable, Hasura, Keycloak đang chạy; bật bằng MOC_IT=1",
]
