# Tệp phủ chạy mô hình bằng GPU NVIDIA (docs/van-hanh.md mục Chạy mô hình bằng GPU). Chỉ nạp khi bật:
#   MOC_AI_DEVICE=gpu trong .env → COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# (Makefile tự đặt; make install ghi vào .env của bản cài). Không nạp thì Ollama chạy CPU như cũ. Máy chủ cần driver
# NVIDIA (≥ 570 cho card compute capability 5.0–6.2, theo docs.ollama.com/gpu) và NVIDIA Container Toolkit; Docker chưa
# có runtime nvidia thì ollama không khởi động được. Chỉ cấp GPU cho ollama, các giới hạn RAM, CPU giữ nguyên.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
