# Schema GraphQL mà vai trò `director` (lãnh đạo đơn vị) thấy qua cổng APISIX: POST /v1/graphql.
# Tệp sinh tự động bằng `make api-docs` từ hệ thống đang chạy, không sửa tay; CI báo lỗi khi tệp cũ.
# subscription_root có trong schema của Hasura nhưng cổng chưa mở WebSocket, nên chưa gọi được qua cổng.

schema {
  query: query_root
  mutation: mutation_root
  subscription: subscription_root
}

"Boolean expression to compare columns of type \"Boolean\". All fields are combined with logical 'AND'."
input Boolean_comparison_exp {
  _eq: Boolean
  _gt: Boolean
  _gte: Boolean
  _in: [Boolean!]
  _is_null: Boolean
  _lt: Boolean
  _lte: Boolean
  _neq: Boolean
  _nin: [Boolean!]
}

type CompleteTaskOutput {
  document: office_documents
  document_id: uuid!
  task_id: String!
}

"Boolean expression to compare columns of type \"Float\". All fields are combined with logical 'AND'."
input Float_comparison_exp {
  _eq: Float
  _gt: Float
  _gte: Float
  _in: [Float!]
  _is_null: Boolean
  _lt: Float
  _lte: Float
  _neq: Float
  _nin: [Float!]
}

"Boolean expression to compare columns of type \"Int\". All fields are combined with logical 'AND'."
input Int_comparison_exp {
  _eq: Int
  _gt: Int
  _gte: Int
  _in: [Int!]
  _is_null: Boolean
  _lt: Int
  _lte: Int
  _neq: Int
  _nin: [Int!]
}

type MyChannel {
  "Zalo: địa chỉ mở bot của đơn vị (MOC_ZALO_BOT_URL), nếu có"
  bot_url: String
  "sms hoặc zalo"
  channel: String!
  "Người gọi đã bật; Zalo bật nghĩa là đã liên kết"
  enabled: Boolean!
  "Zalo chưa liên kết: mã dùng một lần để nhắn cho bot"
  link_code: String
  link_expires_at: timestamptz
  "SMS: số trong danh bạ đã che, còn mã nước và ba số cuối; null khi danh bạ chưa có số (quản trị thêm)"
  phone: String
}

type OtSensor {
  flags: [String!]!
  id: String!
  name: String!
  observed_at: timestamptz
  room: String
  value: Float
}

type OtSensorMap {
  checked_at: timestamptz!
  range_max: Float!
  range_min: Float!
  sensors: [OtSensor!]!
  stale_after_min: Int!
  status: String!
  threshold: Float!
}

"Boolean expression to compare columns of type \"String\". All fields are combined with logical 'AND'."
input String_array_comparison_exp {
  "is the array contained in the given array value"
  _contained_in: [String!]
  "does the array contain the given value"
  _contains: [String!]
  _eq: [String!]
  _gt: [String!]
  _gte: [String!]
  _in: [[String!]!]
  _is_null: Boolean
  _lt: [String!]
  _lte: [String!]
  _neq: [String!]
  _nin: [[String!]!]
}

"Boolean expression to compare columns of type \"String\". All fields are combined with logical 'AND'."
input String_comparison_exp {
  _eq: String
  _gt: String
  _gte: String
  "does the column match the given case-insensitive pattern"
  _ilike: String
  _in: [String!]
  "does the column match the given POSIX regular expression, case insensitive"
  _iregex: String
  _is_null: Boolean
  "does the column match the given pattern"
  _like: String
  _lt: String
  _lte: String
  _neq: String
  "does the column NOT match the given case-insensitive pattern"
  _nilike: String
  _nin: [String!]
  "does the column NOT match the given POSIX regular expression, case insensitive"
  _niregex: String
  "does the column NOT match the given pattern"
  _nlike: String
  "does the column NOT match the given POSIX regular expression, case sensitive"
  _nregex: String
  "does the column NOT match the given SQL regular expression"
  _nsimilar: String
  "does the column match the given POSIX regular expression, case sensitive"
  _regex: String
  "does the column match the given SQL regular expression"
  _similar: String
}

